<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tube Audio Lab</title>

  <!-- [공개 모듈] Plyr 오픈소스 CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" 
        onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css';" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 1. 최상단 검색창 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d0d;
      padding: 5px 0 10px 0;
    }
    .search-box { display: flex; gap: 6px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1c1c1c;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #ff0000; }
    button.search-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      padding: 4px 2px 8px 2px;
    }

    /* 2. 가로 5칸 바둑판 피드 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      background: #161616;
      border-radius: 4px;
      overflow: hidden;
    }
    .video-card:active { background: #252525; }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #222;
    }
    .thumb-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .card-info { padding: 4px; }
    .video-title {
      font-size: 9.5px;
      line-height: 1.25;
      color: #ddd;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* 3. [핵심] 독립 이동/확대축소 부유창 (Floating Modal) */
    #floating-player-modal {
      position: fixed;
      top: 15%;
      left: 5%;
      width: 320px;
      min-width: 180px;
      min-height: 120px;
      z-index: 9999;
      display: none; /* 클릭 전에는 숨김 */
      touch-action: none;
    }

    /* 가는 흰색 실선 테두리 메인창 */
    .modal-main-window {
      width: 100%;
      height: 100%;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.9); /* 요구사항: 가는 흰색 실선 */
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
    }

    /* 내부 비디오 컨테이너 */
    .player-inner {
      width: 100%;
      height: 100%;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .player-inner .plyr {
      width: 100%;
      height: 100%;
    }

    /* 4. 사각 모서리 리사이즈 핸들 */
    .resizer {
      position: absolute;
      width: 16px;
      height: 16px;
      z-index: 10;
    }
    .resizer.tl { top: 0; left: 0; cursor: nwse-resize; }
    .resizer.tr { top: 0; right: 0; cursor: nesw-resize; }
    .resizer.bl { bottom: 0; left: 0; cursor: nesw-resize; }
    .resizer.br { 
      bottom: 0; right: 0; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 50%, rgba(255,255,255,0.7) 50%);
      border-bottom-right-radius: 4px;
    }

    /* 5. [요구사항] 테두리 하부 책갈피 컨트롤 (Drag & 닫기) */
    .modal-bottom-tabs {
      display: flex;
      justify-content: space-between;
      width: 100%;
      padding: 0 8px;
      margin-top: -1px; /* 메인 테두리와 자연스럽게 결합 */
      pointer-events: none;
    }
    .bookmark-tab {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.5); /* 요구사항: 흰색 50% 투명도 */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #111;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 0 0 10px 10px; /* 요구사항: 부드러운 곡선 책갈피 스타일 */
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-top: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .bookmark-tab:active {
      background: rgba(255, 255, 255, 0.8);
      transform: scale(0.96);
    }
    .drag-zone {
      cursor: grab;
      user-select: none;
    }
    .drag-zone:active { cursor: grabbing; }
  </style>
</head>
<body>

  <!-- 최상단 고정 검색창 -->
  <div class="top-header">
    <div class="search-box">
      <input type="text" id="query" placeholder="가수 또는 곡명 검색" onkeyup="if(window.event.keyCode==13){startSearch()}">
      <button class="search-btn" onclick="startSearch()">검색</button>
    </div>
    <div class="status-bar">
      <span id="status">원하는 음악을 검색해보세요.</span>
      <span id="count"></span>
    </div>
  </div>

  <!-- 가로 5칸 바둑판 피드 -->
  <div class="video-grid" id="results"></div>

  <!-- [신규] 독립 이동 및 크기조절 부유창 (Floating Window) -->
  <div id="floating-player-modal">
    <!-- 메인 윈도우 (가는 흰색 실선) -->
    <div class="modal-main-window" id="modalWindow">
      <!-- 4각 모서리 리사이즈 핸들 -->
      <div class="resizer tl" data-dir="tl"></div>
      <div class="resizer tr" data-dir="tr"></div>
      <div class="resizer bl" data-dir="bl"></div>
      <div class="resizer br" data-dir="br"></div>

      <!-- 내부 재생 영역 (함께 확대/축소) -->
      <div class="player-inner">
        <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M7lc1UVf-VE"></div>
      </div>
    </div>

    <!-- 하부 책갈피 컨트롤 (흰색 투명도 50% 곡선) -->
    <div class="modal-bottom-tabs">
      <div class="bookmark-tab drag-zone" id="dragTab">
        <span>✥ Drag</span>
      </div>
      <div class="bookmark-tab" onclick="closePlayerModal()">
        <span>✕ 닫기</span>
      </div>
    </div>
  </div>

  <!-- [공개 모듈] Plyr 오픈소스 JS -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js" 
          onerror="this.onerror=null;document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.js\'><\/script>')"></script>

  <script>
    const SEARCH_SERVERS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net'
    ];
    let activeServerIndex = 0;

    const statusMsg = document.getElementById('status');
    const countMsg = document.getElementById('count');
    const resultsContainer = document.getElementById('results');
    const modal = document.getElementById('floating-player-modal');
    const dragTab = document.getElementById('dragTab');

    const TARGET_COUNT = 100;
    let totalLoadedItems = 0;
    let isSearching = false;

    // 1. Plyr 모듈 초기화
    const player = new Plyr('#player', {
      controls: ['play', 'progress', 'current-time', 'mute', 'volume'],
      youtube: { noCookie: true, rel: 0, showinfo: 0, iv_load_policy: 3, modestbranding: 1 }
    });

    // 2. 검색 서버 페일오버 호출
    async function smartFetch(path) {
      for (let i = 0; i < SEARCH_SERVERS.length; i++) {
        const serverIdx = (activeServerIndex + i) % SEARCH_SERVERS.length;
        const server = SEARCH_SERVERS[serverIdx];
        try {
          const res = await fetch(`${server}${path}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          activeServerIndex = serverIdx;
          return { data, server };
        } catch (e) {
          console.warn(`[서버 우회] ${server}`);
        }
      }
      throw new Error("모든 검색 서버가 응답하지 않습니다.");
    }

    // 3. 100개 검색 실행
    async function startSearch() {
      const q = document.getElementById('query').value.trim();
      if (!q || isSearching) return;

      isSearching = true;
      totalLoadedItems = 0;
      resultsContainer.innerHTML = '';
      statusMsg.innerText = "수집 중...";
      countMsg.innerText = "(0/100)";

      try {
        let { data, server } = await smartFetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        appendGrid(data.items);

        let nextPage = data.nextpage;
        while (nextPage && totalLoadedItems < TARGET_COUNT) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(q)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();
            if (!nextData.items || nextData.items.length === 0) break;
            appendGrid(nextData.items);
            nextPage = nextData.nextpage;
          } catch (e) { break; }
        }
        statusMsg.innerText = "검색 완료";
        countMsg.innerText = `총 ${totalLoadedItems}개`;
      } catch (err) {
        statusMsg.innerText = err.message;
      } finally {
        isSearching = false;
      }
    }

    // 4. 5열 바둑판 피드 렌더링
    function appendGrid(items) {
      if (!items) return;

      items.forEach(item => {
        if (totalLoadedItems >= TARGET_COUNT) return;
        totalLoadedItems++;

        const videoId = item.url.replace('/watch?v=', '');
        const card = document.createElement('div');
        card.className = 'video-card';

        // 카드 클릭 시 독립 부유창으로 오픈 & 재생
        card.onclick = () => openPlayerModal(videoId);

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.thumbnail}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x68/222/555?text=No'">
          </div>
          <div class="card-info">
            <div class="video-title">${item.title}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });

      countMsg.innerText = `(${totalLoadedItems}/${TARGET_COUNT})`;
    }

    // 5. [신규] 부유창 열기 및 닫기
    function openPlayerModal(videoId) {
      modal.style.display = 'block';
      player.source = {
        type: 'video',
        sources: [{ src: videoId, provider: 'youtube' }],
      };
      player.play();
    }

    function closePlayerModal() {
      player.pause();
      modal.style.display = 'none';
    }

    // 6. [핵심] Drag 존을 이용한 자유 이동 로직 (Touch & Mouse 완벽 호환)
    let isDragging = false;
    let startX, startY, initLeft, initTop;

    dragTab.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragTab.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      initLeft = modal.offsetLeft;
      initTop = modal.offsetTop;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      modal.style.left = `${Math.max(0, initLeft + dx)}px`;
      modal.style.top = `${Math.max(0, initTop + dy)}px`;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // 7. [핵심] 4각 모서리 확대/축소 로직
    let isResizing = false;
    let resizeDir = '';
    let startW, startH, resizeStartX, resizeStartY;

    document.querySelectorAll('.resizer').forEach(resizer => {
      resizer.addEventListener('pointerdown', (e) => {
        isResizing = true;
        resizeDir = resizer.getAttribute('data-dir');
        resizer.setPointerCapture(e.pointerId);
        startW = modal.offsetWidth;
        startH = modal.offsetHeight;
        resizeStartX = e.clientX;
        resizeStartY = e.clientY;
        e.stopPropagation();
      });
    });

    window.addEventListener('pointermove', (e) => {
      if (!isResizing) return;
      const dx = e.clientX - resizeStartX;
      const dy = e.clientY - resizeStartY;

      if (resizeDir.includes('r')) {
        modal.style.width = `${Math.max(180, startW + dx)}px`;
      }
      if (resizeDir.includes('b')) {
        modal.style.height = `${Math.max(120, startH + dy)}px`;
      }
      if (resizeDir.includes('l')) {
        const newW = Math.max(180, startW - dx);
        modal.style.width = `${newW}px`;
      }
      if (resizeDir.includes('t')) {
        const newH = Math.max(120, startH - dy);
        modal.style.height = `${newH}px`;
      }
    });

    window.addEventListener('pointerup', () => { isResizing = false; });
  </script>
</body>
</html>
