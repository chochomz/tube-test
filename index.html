<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Tube Player</title>

  <!-- [CDN 이중화] 1순위 plyr.io 실패 시 Cloudflare CDN으로 자동 대체 -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" 
        onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css';" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h2 { text-align: center; margin-bottom: 20px; color: #ff0000; letter-spacing: 1px; }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #ff0000; }
    button {
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #cc0000; }

    .player-wrapper {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .track-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #00ff88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 15px;
      padding: 0 5px;
    }

    .video-list { display: flex; flex-direction: column; gap: 10px; }
    .video-item {
      display: flex;
      gap: 15px;
      background: #181818;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      transition: background 0.2s;
    }
    .video-item:hover { background: #282828; }
    .video-item img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
      background: #333;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .video-channel { font-size: 12px; color: #888; }
    .video-index { font-size: 12px; color: #555; width: 25px; text-align: center; }
  </style>
</head>
<body>

  <h2>Tube Audio Lab (Clean UI)</h2>

  <div class="search-box">
    <input type="text" id="query" placeholder="검색할 곡 또는 가수 입력" onkeyup="if(window.event.keyCode==13){startSearch()}">
    <button onclick="startSearch()">검색</button>
  </div>

  <div class="player-wrapper">
    <div id="trackTitle" class="track-title">재생할 곡을 선택해주세요</div>
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M7lc1UVf-VE"></div>
  </div>

  <div class="status-bar">
    <span id="status">검색어를 입력하세요.</span>
    <span id="count"></span>
  </div>

  <div class="video-list" id="results"></div>

  <!-- [JS CDN 이중화] 1순위 실패 시 2순위 Cloudflare CDN 즉시 로드 -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js" 
          onerror="this.onerror=null;document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.js\'><\/script>')"></script>

  <script>
    // [핵심] 전 세계 분산 예비 검색 API 서버 풀 (차단 대비 3중망)
    const SEARCH_SERVERS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net'
    ];
    let activeServerIndex = 0;

    const statusMsg = document.getElementById('status');
    const countMsg = document.getElementById('count');
    const trackTitle = document.getElementById('trackTitle');
    const resultsContainer = document.getElementById('results');

    const TARGET_COUNT = 100;
    let totalLoadedItems = 0;
    let isSearching = false;

    // Plyr 모듈 초기화
    const player = new Plyr('#player', {
      controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume'],
      youtube: {
        noCookie: true,
        rel: 0,
        showinfo: 0,
        iv_load_policy: 3,
        modestbranding: 1
      }
    });

    // 살아있는 서버로 스마트하게 호출하는 페일오버 함수
    async function smartFetch(path) {
      for (let i = 0; i < SEARCH_SERVERS.length; i++) {
        const serverIdx = (activeServerIndex + i) % SEARCH_SERVERS.length;
        const server = SEARCH_SERVERS[serverIdx];
        try {
          const res = await fetch(`${server}${path}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          activeServerIndex = serverIdx; // 성공한 서버를 메인으로 유지
          return { data, server };
        } catch (e) {
          console.warn(`[서버 다운 감지] ${server} ➔ 다음 예비 서버로 자동 전환`);
        }
      }
      throw new Error("모든 검색 예비 서버가 응답하지 않습니다.");
    }

    async function startSearch() {
      const q = document.getElementById('query').value.trim();
      if (!q || isSearching) return;

      isSearching = true;
      totalLoadedItems = 0;
      resultsContainer.innerHTML = '';
      statusMsg.innerText = "검색 수집 중...";
      countMsg.innerText = "(0 / 100)";

      try {
        // 1. 첫 페이지 호출 (서버 다운 시 자동 우회)
        let { data, server } = await smartFetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        appendResults(data.items);

        // 2. 100개 채울 때까지 백그라운드 수집
        let nextPage = data.nextpage;
        while (nextPage && totalLoadedItems < TARGET_COUNT) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(q)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();

            if (!nextData.items || nextData.items.length === 0) break;
            appendResults(nextData.items);
            nextPage = nextData.nextpage;
          } catch (e) {
            break;
          }
        }

        statusMsg.innerText = "검색 완료";
        countMsg.innerText = `총 ${totalLoadedItems}개 결과`;
      } catch (err) {
        statusMsg.innerText = err.message;
      } finally {
        isSearching = false;
      }
    }

    function appendResults(items) {
      if (!items) return;

      items.forEach(item => {
        if (totalLoadedItems >= TARGET_COUNT) return;

        totalLoadedItems++;
        const videoId = item.url.replace('/watch?v=', '');
        const card = document.createElement('div');
        card.className = 'video-item';

        card.onclick = () => {
          trackTitle.innerText = `[재생 중] ${item.title}`;
          player.source = {
            type: 'video',
            sources: [{ src: videoId, provider: 'youtube' }],
          };
          player.play();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        card.innerHTML = `
          <div class="video-index">${totalLoadedItems}</div>
          <img src="${item.thumbnail}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x68/222/555?text=No+Image'">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.uploaderName}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });

      countMsg.innerText = `(${totalLoadedItems} / ${TARGET_COUNT})`;
    }
  </script>
</body>
</html>
