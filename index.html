<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유튜브 백그라운드 오디오 실험실</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      padding-bottom: 120px; /* 플레이어 공간 확보 */
    }
    h2 { text-align: center; margin-bottom: 15px; color: #ff0000; }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      position: sticky;
      top: 10px;
      z-index: 10;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .video-list { display: flex; flex-direction: column; gap: 15px; }
    .video-item {
      display: flex;
      gap: 12px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
    }
    .video-item:active { background: #333; }
    .video-item img {
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .video-channel { font-size: 12px; color: #aaa; }
    
    /* 하단 고정 플레이어 */
    .player-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1e1e;
      border-top: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }
    .now-playing {
      font-size: 13px;
      color: #4CAF50;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    audio { width: 100%; height: 35px; }
    .status-msg { text-align: center; color: #888; margin-top: 30px; }
  </style>
</head>
<body>

  <h2>Tube Audio Lab</h2>

  <!-- 검색 영역 -->
  <div class="search-box">
    <input type="text" id="query" placeholder="검색할 음악 또는 영상 입력" onkeyup="if(window.event.keyCode==13){search()}">
    <button onclick="search()">검색</button>
  </div>

  <!-- 검색 결과 목록 -->
  <div id="status" class="status-msg">검색어를 입력해보세요.</div>
  <div class="video-list" id="results"></div>

  <!-- 하단 고정 오디오 플레이어 -->
  <div class="player-container">
    <div id="nowPlaying" class="now-playing">대기 중...</div>
    <audio id="audioPlayer" controls autoplay></audio>
  </div>

  <script>
    // 공개 Piped API 서버 (필요 시 다른 인스턴스로 교체 가능)
    const API_BASE = 'https://api.piped.private.coffee';
    const audioPlayer = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const resultsContainer = document.getElementById('results');
    const statusMsg = document.getElementById('status');

    // 1. 유튜브 검색
    async function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;

      statusMsg.innerText = "검색 중입니다...";
      resultsContainer.innerHTML = '';

      try {
        const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}&filter=videos`);
        const data = await res.json();
        
        statusMsg.innerText = '';
        renderResults(data.items);
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "검색에 실패했습니다. (API 서버 응답 오류)";
      }
    }

    // 2. 검색 결과 화면 렌더링
    function renderResults(items) {
      if (!items || items.length === 0) {
        statusMsg.innerText = "검색 결과가 없습니다.";
        return;
      }

      items.forEach(item => {
        // Piped url 형태: "/watch?v=VIDEO_ID"
        const videoId = item.url.replace('/watch?v=', '');
        
        const card = document.createElement('div');
        card.className = 'video-item';
        card.onclick = () => playAudio(videoId, item.title, item.uploaderName, item.thumbnail);

        card.innerHTML = `
          <img src="${item.thumbnail}" loading="lazy">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.uploaderName}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    // 3. 오디오 스트림 추출 및 재생 (광고 제거 핵심)
    async function playAudio(videoId, title, artist, artworkUrl) {
      nowPlaying.innerText = `[로딩 중] ${title}`;
      
      try {
        // 스트림 메타데이터 요청
        const res = await fetch(`${API_BASE}/streams/${videoId}`);
        const data = await res.json();

        // 오디오 스트림 목록 중 m4a(아이폰 호환용) 우선 선택, 없으면 첫 번째 오디오 선택
        let stream = data.audioStreams.find(s => s.mimeType.includes('audio/mp4')) || data.audioStreams[0];

        if (!stream) {
          alert("재생할 수 있는 오디오 스트림이 없습니다.");
          return;
        }

        // HTML5 Audio에 주입 후 재생 (광고 없이 바로 실행)
        audioPlayer.src = stream.url;
        await audioPlayer.play();

        nowPlaying.innerText = `[재생 중] ${title}`;

        // 4. 모바일 백그라운드 재생 & 잠금화면 컨트롤(Media Session API)
        setupMediaSession(title, artist, artworkUrl);

      } catch (err) {
        console.error(err);
        nowPlaying.innerText = "재생 오류가 발생했습니다.";
      }
    }

    // 4. 백그라운드 잠금화면 컨트롤러 등록
    function setupMediaSession(title, artist, artworkUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          artwork: [{ src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }]
        });

        // 스마트폰 잠금화면, 알림바의 재생/정지 버튼과 동기화
        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
        navigator.mediaSession.setActionHandler('seekbackward', () => { audioPlayer.currentTime -= 10; });
        navigator.mediaSession.setActionHandler('seekforward', () => { audioPlayer.currentTime += 10; });
      }
    }
  </script>
</body>
</html>
