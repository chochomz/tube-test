<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tube Audio Lab</title>

  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 10px;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* 1. 최상단 고정 검색창 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d0d;
      padding: 5px 0 10px 0;
    }
    .search-box { display: flex; gap: 6px; }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1c1c1c;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #ff0000; }
    button.search-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      padding: 4px 2px 8px 2px;
    }

    /* 2. 가로 5칸 바둑판 피드 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 5px;
    }
    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      background: #161616;
      border-radius: 4px;
      overflow: hidden;
    }
    .video-card:active { background: #252525; }
    .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%;
      background: #222;
    }
    .thumb-wrapper img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .card-info { padding: 4px; }
    .video-title {
      font-size: 9.5px;
      line-height: 1.25;
      color: #ddd;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* 3. [핵심] 16:9 원본 밀착형 부유창 */
    #floating-player-modal {
      position: fixed;
      top: 14%;
      left: 6%;
      width: 320px; /* 초기 가로 (세로는 16:9인 180px로 JS가 자동 고정) */
      z-index: 9000;
      display: none;
      touch-action: none;
    }

    /* 가는 흰색 실선 테두리 (영상 원본 비율에 100% 밀착) */
    .modal-main-window {
      width: 100%;
      height: 180px; /* JS에서 16:9 비율로 실시간 동기화 */
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 12px 34px rgba(0,0,0,0.85);
    }

    /* 내부 비례 스케일링 스테이지 (800x450 기준 -> 창 크기에 맞춰 통째로 축소/확대) */
    .scale-stage {
      width: 800px;
      height: 450px;
      transform-origin: 0 0;
      position: relative;
      background: #000;
    }
    .scale-stage iframe {
      width: 800px;
      height: 450px;
      border: none;
      display: block;
    }

    /* 창 크기에 비례해서 함께 커지고 작아지는 상단 미니 제목 오버레이 */
    .proportional-title-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 10px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent);
      color: rgba(255,255,255,0.9);
      font-size: 18px; /* 320px 창에서는 0.4배인 7.2px로 아주 작게 시작! 확대 시 같이 커짐 */
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      z-index: 5;
    }

    /* 4각 모서리 리사이즈 핸들 */
    .resizer {
      position: absolute;
      width: 18px;
      height: 18px;
      z-index: 20;
    }
    .resizer.tl { top: 0; left: 0; cursor: nwse-resize; }
    .resizer.tr { top: 0; right: 0; cursor: nesw-resize; }
    .resizer.bl { bottom: 0; left: 0; cursor: nesw-resize; }
    .resizer.br {
      bottom: 0; right: 0; cursor: nwse-resize;
      background: linear-gradient(135deg, transparent 55%, rgba(255,255,255,0.8) 55%);
    }

    /* 4. [핵심] 하부 겹쳐지는 책갈피 탭 구조 (Overlapping Bookmark Tabs) */
    .modal-bottom-tabs {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      padding: 0 4px;
      margin-top: -1px; /* 메인 흰색 테두리와 밀착 */
      pointer-events: none;
    }
    .tab-group-left {
      display: flex;
      align-items: flex-start;
      pointer-events: auto;
    }
    .bookmark-tab {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.5); /* 흰색 50% 투명도 */
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #111;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 0 0 11px 11px;
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-top: none;
      box-shadow: 2px 4px 10px rgba(0,0,0,0.45);
      cursor: pointer;
      position: relative;
      transition: background 0.15s, padding-top 0.15s;
      white-space: nowrap;
    }
    .bookmark-tab:active {
      background: rgba(255, 255, 255, 0.85);
    }
    /* 책갈피가 서로 겹쳐지는 스타일 */
    .bookmark-tab.tab-1 {
      z-index: 4;
      cursor: grab;
    }
    .bookmark-tab.tab-2 {
      z-index: 3;
      margin-left: -8px; /* 왼쪽 탭 밑으로 부드럽게 겹침 */
      padding-left: 16px;
      background: rgba(240, 248, 255, 0.55);
    }

    /* 5. [신규] MP3 / 320kbps 음원추출 전용 모달 */
    #mp3-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .mp3-modal-box {
      width: 100%;
      max-width: 340px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
      text-align: center;
    }
    .mp3-modal-header {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
    }
    .mp3-track-name {
      font-size: 12px;
      color: #ccc;
      background: #222;
      padding: 8px 10px;
      border-radius: 6px;
      margin-bottom: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mp3-quality-badge {
      display: inline-block;
      background: rgba(255, 0, 0, 0.15);
      border: 1px solid #ff3333;
      color: #ff5555;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 15px;
    }
    .mp3-widget-frame {
      width: 100%;
      height: 62px;
      border: none;
      border-radius: 8px;
      background: #111;
      margin-bottom: 12px;
    }
    .mp3-action-btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      background: #ffffff;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .mp3-close-btn {
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #444;
      background: transparent;
      color: #aaa;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. 최상단 검색 헤더 -->
  <div class="top-header">
    <div class="search-box">
      <input type="text" id="query" placeholder="가수 또는 곡명 검색" onkeyup="if(window.event.keyCode==13){startSearch()}">
      <button class="search-btn" onclick="startSearch()">검색</button>
    </div>
    <div class="status-bar">
      <span id="status">원하는 음악을 검색해보세요.</span>
      <span id="count"></span>
    </div>
  </div>

  <!-- 2. 가로 5칸 바둑판 피드 -->
  <div class="video-grid" id="results"></div>

  <!-- 3. 16:9 밀착형 독립 부유창 (Floating Window) -->
  <div id="floating-player-modal">
    <div class="modal-main-window" id="modalWindow">
      <!-- 4각 모서리 리사이즈 핸들 -->
      <div class="resizer tl" data-dir="tl"></div>
      <div class="resizer tr" data-dir="tr"></div>
      <div class="resizer bl" data-dir="bl"></div>
      <div class="resizer br" data-dir="br"></div>

      <!-- 800x450 비례 스케일링 스테이지 (화면 확대/축소 시 내부 제목과 유튜브 버튼이 함께 확대/축소됨) -->
      <div class="scale-stage" id="scaleStage">
        <div class="proportional-title-bar" id="propTitle">재생 대기 중</div>
        <div id="yt-iframe-holder"></div>
      </div>
    </div>

    <!-- 하부 겹쳐지는 책갈피 탭 -->
    <div class="modal-bottom-tabs">
      <div class="tab-group-left">
        <div class="bookmark-tab tab-1" id="dragTab">
          <span>✥ Drag</span>
        </div>
        <div class="bookmark-tab tab-2" onclick="openMp3Modal()">
          <span>♪ 음원추출</span>
        </div>
      </div>

      <div class="bookmark-tab" onclick="closePlayerModal()">
        <span>✕ 닫기</span>
      </div>
    </div>
  </div>

  <!-- 4. MP3 / 320kbps 전용 음원추출 모달 -->
  <div id="mp3-modal-overlay">
    <div class="mp3-modal-box">
      <div class="mp3-modal-header">고음질 음원 추출</div>
      <div class="mp3-track-name" id="mp3TrackTitle">곡 제목</div>
      <div class="mp3-quality-badge">고정 포맷 : MP3 / 320kbps</div>

      <!-- 320kbps MP3 즉시 변환 모듈 -->
      <iframe id="mp3WidgetFrame" class="mp3-widget-frame" scrolling="no"></iframe>

      <button class="mp3-action-btn" id="directStreamBtn" onclick="extractDirectAudio()">
        ⬇ 다이렉트 음원 스트림 추출 (320k)
      </button>
      <button class="mp3-close-btn" onclick="closeMp3Modal()">닫기</button>
    </div>
  </div>

  <script>
    const SEARCH_SERVERS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net'
    ];
    let activeServerIndex = 0;

    const statusMsg = document.getElementById('status');
    const countMsg = document.getElementById('count');
    const resultsContainer = document.getElementById('results');
    
    const modal = document.getElementById('floating-player-modal');
    const modalWindow = document.getElementById('modalWindow');
    const scaleStage = document.getElementById('scaleStage');
    const ytHolder = document.getElementById('yt-iframe-holder');
    const propTitle = document.getElementById('propTitle');
    const dragTab = document.getElementById('dragTab');

    const mp3Overlay = document.getElementById('mp3-modal-overlay');
    const mp3TrackTitle = document.getElementById('mp3TrackTitle');
    const mp3WidgetFrame = document.getElementById('mp3WidgetFrame');
    const directStreamBtn = document.getElementById('directStreamBtn');

    const TARGET_COUNT = 100;
    const BASE_STAGE_WIDTH = 800; // 기준 해상도 800x450 (16:9)
    let totalLoadedItems = 0;
    let isSearching = false;
    let currentVideoId = '';
    let currentVideoTitle = '';

    // 1. 16:9 비율 완벽 유지 및 내부 요소 비례 스케일링 함수
    function apply16by9Scale(newWidth) {
      const clampedW = Math.max(200, Math.min(newWidth, window.innerWidth - 16));
      const exactH = Math.round(clampedW * (9 / 16)); // 16:9 칼비율

      modal.style.width = `${clampedW}px`;
      modalWindow.style.height = `${exactH}px`;

      // 창 크기에 비례하여 내부 제목과 유튜브 고유 컨트롤을 함께 스케일링
      const scaleRatio = clampedW / BASE_STAGE_WIDTH;
      scaleStage.style.transform = `scale(${scaleRatio})`;
    }

    // 초기 320px 기준 16:9 세팅
    apply16by9Scale(320);

    // 2. 다중 검색 서버 페일오버
    async function smartFetch(path) {
      for (let i = 0; i < SEARCH_SERVERS.length; i++) {
        const serverIdx = (activeServerIndex + i) % SEARCH_SERVERS.length;
        const server = SEARCH_SERVERS[serverIdx];
        try {
          const res = await fetch(`${server}${path}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          activeServerIndex = serverIdx;
          return { data, server };
        } catch (e) {
          console.warn(`[서버 전환] ${server}`);
        }
      }
      throw new Error("검색 서버 응답 없음");
    }

    // 3. 100개 검색 수집
    async function startSearch() {
      const q = document.getElementById('query').value.trim();
      if (!q || isSearching) return;

      isSearching = true;
      totalLoadedItems = 0;
      resultsContainer.innerHTML = '';
      statusMsg.innerText = "수집 중...";
      countMsg.innerText = "(0/100)";

      try {
        let { data, server } = await smartFetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        appendGrid(data.items);

        let nextPage = data.nextpage;
        while (nextPage && totalLoadedItems < TARGET_COUNT) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(q)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();
            if (!nextData.items || nextData.items.length === 0) break;
            appendGrid(nextData.items);
            nextPage = nextData.nextpage;
          } catch (e) { break; }
        }
        statusMsg.innerText = "검색 완료";
        countMsg.innerText = `총 ${totalLoadedItems}개`;
      } catch (err) {
        statusMsg.innerText = err.message;
      } finally {
        isSearching = false;
      }
    }

    // 4. 5열 바둑판 렌더링
    function appendGrid(items) {
      if (!items) return;

      items.forEach(item => {
        if (totalLoadedItems >= TARGET_COUNT) return;
        totalLoadedItems++;

        const videoId = item.url.replace('/watch?v=', '');
        const card = document.createElement('div');
        card.className = 'video-card';

        card.onclick = () => openPlayerModal(videoId, item.title);

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.thumbnail}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x68/222/555?text=No'">
          </div>
          <div class="card-info">
            <div class="video-title">${item.title}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });

      countMsg.innerText = `(${totalLoadedItems}/${TARGET_COUNT})`;
    }

    // 5. 부유창 재생 (유튜브 고유 전체화면 화살표 fs=1 활성화)
    function openPlayerModal(videoId, title) {
      currentVideoId = videoId;
      currentVideoTitle = title;
      propTitle.innerText = title;
      modal.style.display = 'block';
      apply16by9Scale(modal.offsetWidth || 320);

      // controls=1 & fs=1 로 터치 시 유튜브 고유의 확대/축소 화살표 노출
      ytHolder.innerHTML = `
        <iframe
          src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=1&fs=1&modestbranding=1&rel=0&playsinline=1"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen>
        </iframe>
      `;
    }

    function closePlayerModal() {
      ytHolder.innerHTML = '';
      modal.style.display = 'none';
    }

    // 6. MP3 / 320kbps 전용 추출 모달 제어
    function openMp3Modal() {
      if (!currentVideoId) return;
      mp3TrackTitle.innerText = currentVideoTitle;
      directStreamBtn.innerText = "⬇ 다이렉트 음원 스트림 추출 (320k)";
      
      // 320kbps MP3 전용 변환 버튼 위젯 로드
      const ytUrl = `https://www.youtube.com/watch?v=${currentVideoId}`;
      mp3WidgetFrame.src = `https://loader.to/api/button/?url=${encodeURIComponent(ytUrl)}&f=mp3&color=ff0000`;
      
      mp3Overlay.style.display = 'flex';
    }

    function closeMp3Modal() {
      mp3Overlay.style.display = 'none';
      mp3WidgetFrame.src = '';
    }

    async function extractDirectAudio() {
      if (!currentVideoId) return;
      directStreamBtn.innerText = "음원 스트림 추출 중...";
      try {
        const { data } = await smartFetch(`/streams/${currentVideoId}`);
        // 최고 음질 오디오 스트림 선별
        const sortedAudio = (data.audioStreams || []).sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
        const bestStream = sortedAudio[0];

        if (bestStream && bestStream.url) {
          const a = document.createElement('a');
          a.href = bestStream.url;
          a.target = '_blank';
          a.download = `${currentVideoTitle}.mp3`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          directStreamBtn.innerText = "✓ 추출 완료 (새 창에서 저장)";
        } else {
          throw new Error();
        }
      } catch (e) {
        directStreamBtn.innerText = "위 빨간색 MP3 변환 버튼을 눌러 저장하세요";
      }
    }

    // 7. Drag 탭 이동 로직
    let isDragging = false;
    let startX, startY, initLeft, initTop;

    dragTab.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragTab.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;
      initLeft = modal.offsetLeft;
      initTop = modal.offsetTop;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      modal.style.left = `${Math.max(0, initLeft + dx)}px`;
      modal.style.top = `${Math.max(0, initTop + dy)}px`;
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    // 8. 4각 모서리 16:9 비율 연동 확대/축소 로직
    let isResizing = false;
    let resizeDir = '';
    let startW, resizeStartX;

    document.querySelectorAll('.resizer').forEach(resizer => {
      resizer.addEventListener('pointerdown', (e) => {
        isResizing = true;
        resizeDir = resizer.getAttribute('data-dir');
        resizer.setPointerCapture(e.pointerId);
        startW = modal.offsetWidth;
        resizeStartX = e.clientX;
        e.stopPropagation();
      });
    });

    window.addEventListener('pointermove', (e) => {
      if (!isResizing) return;
      const dx = e.clientX - resizeStartX;
      const targetW = resizeDir.includes('l') ? (startW - dx) : (startW + dx);
      apply16by9Scale(targetW);
    });

    window.addEventListener('pointerup', () => { isResizing = false; });
  </script>
</body>
</html>
