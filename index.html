<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Tube Player</title>

  <!-- [공개 모듈] Plyr 오픈소스 플레이어 CSS -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    h2 { text-align: center; margin-bottom: 20px; color: #ff0000; letter-spacing: 1px; }

    /* 검색창 영역 */
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }
    input {
      flex: 1;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1e1e1e;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    input:focus { border-color: #ff0000; }
    button {
      padding: 14px 24px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #cc0000; }

    /* 플레이어 영역 (군더더기 없는 미니멀 디자인) */
    .player-wrapper {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 25px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .track-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 12px;
      color: #00ff88;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 검색 결과 리스트 */
    .video-list { display: flex; flex-direction: column; gap: 10px; }
    .video-item {
      display: flex;
      gap: 15px;
      background: #181818;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
      transition: background 0.2s;
    }
    .video-item:hover { background: #282828; }
    .video-item img {
      width: 120px;
      height: 68px;
      object-fit: cover;
      border-radius: 6px;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }
    .video-channel { font-size: 12px; color: #888; }
    .status-msg { text-align: center; color: #888; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Tube Audio Lab (Clean UI)</h2>

  <!-- 1. 검색 바 -->
  <div class="search-box">
    <input type="text" id="query" placeholder="노트북에서 들을 곡 또는 가수 입력" onkeyup="if(window.event.keyCode==13){search()}">
    <button onclick="search()">검색</button>
  </div>

  <!-- 2. 오픈소스 모듈 기반 클린 플레이어 -->
  <div class="player-wrapper">
    <div id="trackTitle" class="track-title">재생할 곡을 선택해주세요</div>
    <!-- Plyr 오픈소스 모듈이 장착될 컨테이너 -->
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M7lc1UVf-VE"></div>
  </div>

  <div id="status" class="status-msg">검색어를 입력하고 검색 버튼을 누르세요.</div>
  <div class="video-list" id="results"></div>

  <!-- [공개 모듈] Plyr 오픈소스 자바스크립트 엔진 -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

  <script>
    const statusMsg = document.getElementById('status');
    const trackTitle = document.getElementById('trackTitle');
    const resultsContainer = document.getElementById('results');

    // 1. [공개 모듈 초기화] 유튜브의 군더더기 UI를 모듈 레벨에서 싹 걷어냅니다.
    const player = new Plyr('#player', {
      controls: ['play', 'progress', 'current-time', 'duration', 'mute', 'volume'],
      youtube: {
        noCookie: true,
        rel: 0,          // 추천 영상 표시 안 함
        showinfo: 0,     // 영상 정보 바 숨김
        iv_load_policy: 3, // 특수효과/주석 숨김
        modestbranding: 1  // 유튜브 로고 최소화
      }
    });

    // 2. 검색 엔진 (안정적인 공개 검색 프록시)
    async function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;

      statusMsg.innerText = "유튜브 검색 중...";
      resultsContainer.innerHTML = '';

      try {
        const res = await fetch(`https://api.piped.private.coffee/search?q=${encodeURIComponent(q)}&filter=videos`);
        const data = await res.json();
        
        statusMsg.innerText = '';
        renderResults(data.items);
      } catch (e) {
        statusMsg.innerText = "검색 일시 오류. 다시 시도해 주세요.";
      }
    }

    // 3. 검색 결과 렌더링
    function renderResults(items) {
      if (!items || items.length === 0) {
        statusMsg.innerText = "검색 결과가 없습니다.";
        return;
      }

      items.forEach(item => {
        const videoId = item.url.replace('/watch?v=', '');
        const card = document.createElement('div');
        card.className = 'video-item';
        
        // 클릭 시 모듈을 통해 영상 교체 및 자동 재생
        card.onclick = () => {
          trackTitle.innerText = `[재생 중] ${item.title}`;
          
          // Plyr 모듈의 소스 변경 함수 (공식 스트림으로 전환)
          player.source = {
            type: 'video',
            sources: [{
              src: videoId,
              provider: 'youtube',
            }],
          };
          
          player.play();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        card.innerHTML = `
          <img src="${item.thumbnail}" loading="lazy">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.uploaderName}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }
  </script>
</body>
</html>
