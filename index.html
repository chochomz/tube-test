      try {
        const snap = await db.collection(FB_COLLECTION).doc(getPinsDocId()).get();
        if (snap.exists && Array.isArray(snap.data().items)) {
          const ids = snap.data().items.map(it => it && it.id).filter(Boolean);
          pinnedVideoIds = new Set(ids);
          saveLocalPinsOnly();
          if (currentFeedItems.length > 0) renderSortedFeed();
        }
      } catch (err) {
        console.warn('[별표 동기화 로드 실패]', err);
      }
    }

    async function savePinsToCloud() {
      saveLocalPinsOnly();
      if (!fbReady || !db || !currentUser) return;
      try {
        const pinList = Array.from(pinnedVideoIds).slice(0, MAX_TAB_ITEMS).map(id => ({ id }));
        await db.collection(FB_COLLECTION).doc(getPinsDocId()).set({
          keyword: getPinsDocId(),
          updatedAt: Date.now(),
          items: pinList
        });
      } catch (err) {
        console.warn('[별표 클라우드 저장 실패]', err);
      }
    }

    function togglePinVideo(videoId) {
      if (!videoId) return;
      if (pinnedVideoIds.has(videoId)) {
        pinnedVideoIds.delete(videoId);
      } else {
        pinnedVideoIds.add(videoId);
      }
      savePinsToCloud();
      renderSortedFeed();
    }

    // 3. 50개 단위 고속 검색 수집 (총 300개까지 스크롤 시 50개씩 추가 로드 & DB 효율화)
    function updateScrollSentinelUI() {
      const el = document.getElementById('feedScrollSentinel');
      if (!el) return;
      if (isLoadingMore) {
        el.textContent = '추가 불러오는 중...';
        return;
      }
      const hasMoreDb = currentFeedIsCache && currentFeedItems.length < Math.min(dbFeedPool.length, MAX_TAB_ITEMS);
      const hasMoreLive = !currentFeedIsCache && activeSearchSession && !activeSearchSession.exhausted && currentFeedItems.length < MAX_TAB_ITEMS;
      el.textContent = (hasMoreDb || hasMoreLive) ? '▼ 스크롤하여 50개 더 보기' : '';
    }

    function initFeedScrollObserver() {
      const sentinel = document.getElementById('feedScrollSentinel');
      if (!sentinel || typeof IntersectionObserver === 'undefined') return;
      if (feedScrollObserver) feedScrollObserver.disconnect();
      feedScrollObserver = new IntersectionObserver((entries) => {
        if (entries.some(e => e.isIntersecting)) {
          loadMoreChunk50();
        }
      }, { rootMargin: '260px' });
      feedScrollObserver.observe(sentinel);
    }

    async function startSearch() {
      const q = document.getElementById('query').value.trim();
      if (!q) {
        if (!fbVerified) {
          const ok = await verifyFirebaseConnection();
          if (!ok && lastDbErrorMsg) statusMsg.innerText = `DB: ${lastDbErrorMsg}`;
        }
        return;
      }
      if (isSearching || !currentUser) return;

      closeFilterPanel();
      isSearching = true;
      isLoadingMore = false;
      setWorkingState(true);
      totalLoadedItems = 0;
      currentSearchCollected = [];
      currentFeedItems = [];
      dbFeedPool = [];
      activeSearchSession = null;
      currentFeedIsCache = false;
      activeTabKeyword = '';
      renderSavedTabsBar();
      resultsContainer.innerHTML = '';
      statusMsg.innerText = '';
      updateScrollSentinelUI();

      try {
        const seenIds = new Set();
        let { data, server } = await smartFetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        appendChunkItems(data.items, CHUNK_SIZE, seenIds, false, false);

        let nextPage = data.nextpage;
        while (nextPage && currentFeedItems.length < CHUNK_SIZE) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(q)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();
            if (!nextData.items || nextData.items.length === 0) {
              nextPage = null;
              break;
            }
            appendChunkItems(nextData.items, CHUNK_SIZE, seenIds, false, true);
            nextPage = nextData.nextpage;
          } catch (e) {
            nextPage = null;
            break;
          }
        }

        activeSearchSession = {
          query: q,
          server: server,
          nextpage: nextPage || null,
          exhausted: !nextPage || currentFeedItems.length >= MAX_TAB_ITEMS
        };

        renderSortedFeed();
        statusMsg.innerText = '';

        if (currentSearchCollected.length > 0) {
          const docId = getSearchTabDocId(q);
          await saveSearchTab(q, currentSearchCollected);
          saveLastViewedFeed(docId, q);
        }
      } catch (err) {
        statusMsg.innerText = err.message;
      } finally {
        isSearching = false;
        setWorkingState(false);
        updateScrollSentinelUI();
      }
    }

    // 스크롤 하단 도달 시 50개씩 추가 로드 (총 최대 300개, 정렬은 불러온 범위 내에서만 적용)
    async function loadMoreChunk50() {
      if (isSearching || isLoadingMore || !currentUser) return;
      if (currentFeedItems.length === 0 || currentFeedItems.length >= MAX_TAB_ITEMS) {
        updateScrollSentinelUI();
        return;
      }

      // 1) 저장 탭(DB) 풀에서 다음 50개 단계적 노출
      if (currentFeedIsCache) {
        if (currentFeedItems.length >= dbFeedPool.length) {
          updateScrollSentinelUI();
          return;
        }
        isLoadingMore = true;
        updateScrollSentinelUI();
        const nextSlice = dbFeedPool.slice(currentFeedItems.length, Math.min(currentFeedItems.length + CHUNK_SIZE, MAX_TAB_ITEMS));
        const seenIds = new Set(currentFeedItems.map(it => it.id));
        appendChunkItems(nextSlice, Math.min(currentFeedItems.length + CHUNK_SIZE, MAX_TAB_ITEMS), seenIds, true, false);
        isLoadingMore = false;
        updateScrollSentinelUI();
        return;
      }

      // 2) 실시간 검색 결과에서 다음 50개 추가 수집 + DB 증분 저장
      if (!activeSearchSession || activeSearchSession.exhausted || !activeSearchSession.nextpage) {
        updateScrollSentinelUI();
        return;
      }

      isLoadingMore = true;
      setWorkingState(true);
      updateScrollSentinelUI();

      try {
        const targetTotal = Math.min(currentFeedItems.length + CHUNK_SIZE, MAX_TAB_ITEMS);
        const seenIds = new Set(currentFeedItems.map(it => it.id));
        let nextPage = activeSearchSession.nextpage;
        const { server, query } = activeSearchSession;

        while (nextPage && currentFeedItems.length < targetTotal) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(query)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();
            if (!nextData.items || nextData.items.length === 0) {
              nextPage = null;
              break;
            }
            appendChunkItems(nextData.items, targetTotal, seenIds, false, true);
            nextPage = nextData.nextpage;
          } catch (e) {
            nextPage = null;
            break;
          }
        }

        activeSearchSession.nextpage = nextPage || null;
        activeSearchSession.exhausted = !nextPage || currentFeedItems.length >= MAX_TAB_ITEMS;
        renderSortedFeed();

        if (currentSearchCollected.length > 0) {
          await saveSearchTab(query, currentSearchCollected);
        }
      } finally {
        isLoadingMore = false;
        setWorkingState(false);
        updateScrollSentinelUI();
      }
    }

    // 4. 청크 단위 데이터 수집 + 불러온 범위 한정 정렬 렌더링
    function appendChunkItems(items, maxLimit, seenIds, isFromCache = false, deferRender = false) {
      if (!items || !items.length) return;
      currentFeedIsCache = isFromCache;

      items.forEach(item => {
        if (currentFeedItems.length >= maxLimit || currentFeedItems.length >= MAX_TAB_ITEMS) return;
        const videoId = extractVideoId(item);
        if (!videoId || (seenIds && seenIds.has(videoId))) return;
        if (seenIds) seenIds.add(videoId);

        const title = item.t !== undefined ? item.t : (item.title || '제목 없음');
        const uploaded = Number(item.u !== undefined ? item.u : (item.uploaded > 0 ? item.uploaded : 0)) || 0;
        const duration = Number(item.d !== undefined ? item.d : (item.duration > 0 ? item.duration : 0)) || 0;
        const views = Number(item.v !== undefined ? item.v : (item.views > 0 ? item.views : 0)) || 0;
        const quality = computeQualityScore(title, item);

        totalLoadedItems++;
        const compactObj = { id: videoId, t: title, u: uploaded, d: duration, v: views, q: quality };

        if (!isFromCache) {
          currentSearchCollected.push(compactObj);
        }

        currentFeedItems.push({
          ...compactObj,
          _clean: simplifyTitle(title),
          _idx: currentFeedItems.length
        });
      });

      if (!deferRender) {
        renderSortedFeed();
      }
    }

    function compareKoreanTitle(aStr, bStr) {
      const aKo = /^[가-힣]/.test(aStr) ? 0 : 1;
      const bKo = /^[가-힣]/.test(bStr) ? 0 : 1;
      if (aKo !== bKo) return aKo - bKo;
      return aStr.localeCompare(bStr, 'ko', { numeric: true });
    }

    // 피드 영상 터치 감도 둔화 엔진 (스크롤 직후 220ms 차단 + 8px 이동 차단 + 안정적 탭 시 실행)
    let lastFeedScrollTime = 0;
    window.addEventListener('scroll', () => {
      lastFeedScrollTime = Date.now();
    }, { passive: true });

    function attachDampedCardTap(cardEl, onActivate) {
      let downTime = 0;
      let startX = 0;
      let startY = 0;
      let moved = false;
      let activePtrId = null;

      cardEl.addEventListener('pointerdown', (e) => {
        if (e.target && e.target.closest && e.target.closest('.star-pin-btn')) return;
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (Date.now() - lastFeedScrollTime < 220) {
          activePtrId = null;
          return;
        }
        activePtrId = e.pointerId;
        downTime = Date.now();
        startX = e.clientX;
        startY = e.clientY;
        moved = false;
      }, { passive: true });

      cardEl.addEventListener('pointermove', (e) => {
        if (activePtrId !== e.pointerId || moved) return;
        if (Math.hypot(e.clientX - startX, e.clientY - startY) > 8) {
          moved = true;
          activePtrId = null;
        }
      }, { passive: true });

      cardEl.addEventListener('pointercancel', () => {
        activePtrId = null;
        moved = true;
      }, { passive: true });

      cardEl.addEventListener('pointerup', (e) => {
        if (activePtrId !== e.pointerId) return;
        activePtrId = null;
        if (moved) return;
        if (Date.now() - lastFeedScrollTime < 220) return;
        const holdMs = Date.now() - downTime;
        const minHold = e.pointerType === 'mouse' ? 40 : 90;
        if (holdMs >= minHold && holdMs <= 650) {
          onActivate();
        }
      });
    }

    function renderSortedFeed() {
      // 정렬은 현재 불러온 범위(currentFeedItems) 내에서만 적용
      const sorted = [...currentFeedItems].sort((a, b) => {
        const aPin = pinnedVideoIds.has(a.id) ? 1 : 0;
        const bPin = pinnedVideoIds.has(b.id) ? 1 : 0;
        if (aPin !== bPin) return bPin - aPin;

        for (const cond of activeFilterOrder) {
          let diff = 0;
          if (cond === 'recent') diff = (b.u || 0) - (a.u || 0);
          else if (cond === 'korean') diff = compareKoreanTitle(a._clean, b._clean);
          else if (cond === 'size') diff = (b.d || 0) - (a.d || 0);
          else if (cond === 'views') diff = (b.v || 0) - (a.v || 0);
          else if (cond === 'hq') diff = (b.q || computeQualityScore(b.t)) - (a.q || computeQualityScore(a.t));
          if (diff !== 0) return diff;
        }

        return (a._idx || 0) - (b._idx || 0);
      });

      resultsContainer.innerHTML = '';
      const frag = document.createDocumentFragment();

      sorted.forEach(item => {
        const isPinned = pinnedVideoIds.has(item.id);
        const card = document.createElement('div');
        card.className = 'video-card' + (isPinned ? ' pinned-card' : '');
        attachDampedCardTap(card, () => openPlayerModal(item.id, item.t));

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrapper';

        const img = document.createElement('img');
        img.src = getFastThumbUrl(item.id);
        img.loading = 'lazy';
        img.decoding = 'async';
        img.onerror = function() { this.onerror = null; this.src = FALLBACK_THUMB; };
        thumbWrap.appendChild(img);

        const starBtn = document.createElement('button');
        starBtn.type = 'button';
        starBtn.className = 'star-pin-btn' + (isPinned ? ' pinned' : '');
        starBtn.textContent = isPinned ? '★' : '☆';
        starBtn.title = isPinned ? '상단 고정 해제' : '최상단 고정';
        starBtn.onclick = (e) => {
          e.stopPropagation();
          togglePinVideo(item.id);
        };
        thumbWrap.appendChild(starBtn);

        const info = document.createElement('div');
        info.className = 'card-info';
        const titleEl = document.createElement('div');
        titleEl.className = 'video-title';
        titleEl.textContent = item._clean;
        titleEl.title = item.t;
        info.appendChild(titleEl);

        card.appendChild(thumbWrap);
        card.appendChild(info);
        frag.appendChild(card);
      });

      resultsContainer.appendChild(frag);
      updateScrollSentinelUI();
    }

    // TUBE_LAB_V5_IOS_BG_PATCH
    // 5. 부유창 재생 + iOS 26.3.1 무중단 백그라운드 오디오 엔진 (Piped+Invidious 다중 페일오버)
    const STREAM_PIPED_SERVERS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net',
      'https://pipedapi.adminforge.de',
      'https://pipedapi.leptons.xyz'
    ];
    const STREAM_INVIDIOUS_SERVERS = [
      'https://inv.nadeko.net',
      'https://yewtu.be',
      'https://invidious.nerdvpn.de'
    ];
    const SILENT_WAV_URI = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';

    const bgModeTab = document.getElementById('bgModeTab');
    const bgAudioOverlay = document.getElementById('bgAudioOverlay');
    const bgOverlayTitle = document.getElementById('bgOverlayTitle');
    const bgPlayToggleBtn = document.getElementById('bgPlayToggleBtn');
    const bgTimeText = document.getElementById('bgTimeText');

    let isDockedToBookmark = false;
    let dockSide = 'right';
    let lastWindowWidth = 320;
    let isBgAudioPlaying = false;
    let userPausedBg = false;
    let iosAudioUnlocked = false;
    let lastKnownPlaySec = 0;
    let prefetchedAudioCandidates = [];
    let prefetchedVideoId = '';
    let prefetchPromise = null;
    let activeCandidateIdx = 0;
    let pendingBgSeekSec = 0;

    function formatSec(sec) {
      const s = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${r < 10 ? '0' : ''}${r}`;
    }

    function sendYtCommand(func, args = []) {
      const frame = document.getElementById('ytPlayerFrame');
      if (!frame || !frame.contentWindow) return;
      try {
        frame.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*');
      } catch (e) {}
    }

    // iOS Safari / 홈화면 PWA 오디오 제스처 선행 잠금해제 (사용자 터치 내부에서 실행)
    function unlockIosAudioOnce() {
      if (iosAudioUnlocked || isBgAudioPlaying) return;
      try {
        bgAudio.muted = true;
        bgAudio.src = SILENT_WAV_URI;
        const p = bgAudio.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            bgAudio.pause();
            bgAudio.muted = false;
            iosAudioUnlocked = true;
          }).catch(() => { bgAudio.muted = false; });
        }
      } catch (e) { bgAudio.muted = false; }
    }

    function updateBgModeUI() {
      const hasReady = (prefetchedVideoId === currentVideoId && prefetchedAudioCandidates.length > 0);
      if (bgModeTab) {
        bgModeTab.classList.toggle('bg-ready', hasReady && !isBgAudioPlaying);
        bgModeTab.classList.toggle('bg-on', isBgAudioPlaying);
      }
      if (bgAudioOverlay) {
        bgAudioOverlay.classList.toggle('active', isBgAudioPlaying && !isDockedToBookmark);
      }
      if (bgOverlayTitle) {
        bgOverlayTitle.textContent = simplifyTitle(currentVideoTitle);
      }
      if (bgPlayToggleBtn) {
        bgPlayToggleBtn.textContent = bgAudio.paused ? '▶' : '❚❚';
      }
      miniBookmark.classList.toggle('bg-active', isBgAudioPlaying && !bgAudio.paused);
    }

    function stopBgAudioClean() {
      try {
        bgAudio.pause();
        bgAudio.removeAttribute('src');
        bgAudio.load();
      } catch (e) {}
      isBgAudioPlaying = false;
      userPausedBg = false;
      pendingBgSeekSec = 0;
      if ('mediaSession' in navigator) {
        try { navigator.mediaSession.playbackState = 'none'; } catch (e) {}
      }
      updateBgModeUI();
    }

    function setupMediaSession(title, videoId) {
      if (!('mediaSession' in navigator)) return;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: simplifyTitle(title),
          artist: 'myTube',
          album: 'Background Audio',
          artwork: [
            { src: `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`, sizes: '480x360', type: 'image/jpeg' }
          ]
        });
        navigator.mediaSession.setActionHandler('play', () => {
          userPausedBg = false;
          if (bgAudio.src && (isBgAudioPlaying || isDockedToBookmark)) {
            bgAudio.play().catch(() => {});
          } else {
            sendYtCommand('playVideo');
          }
        });
        navigator.mediaSession.setActionHandler('pause', () => {
          userPausedBg = true;
          if (isBgAudioPlaying) bgAudio.pause();
          else sendYtCommand('pauseVideo');
        });
        navigator.mediaSession.setActionHandler('seekbackward', () => {
          if (isBgAudioPlaying) bgAudio.currentTime = Math.max(0, bgAudio.currentTime - 10);
        });
        navigator.mediaSession.setActionHandler('seekforward', () => {
          if (isBgAudioPlaying && isFinite(bgAudio.duration)) {
            bgAudio.currentTime = Math.min(bgAudio.duration, bgAudio.currentTime + 10);
          }
        });
      } catch (e) {}
    }

    async function fetchJsonWithTimeout(url, timeoutMs = 5500) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        const res = await fetch(url, { signal: ctrl.signal });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return await res.json();
      } finally {
        clearTimeout(timer);
      }
    }

    // 다중 Piped + Invidious 페일오버로 iOS 네이티브 재생 가능(M4A/HLS/MP4) 오디오 후보 수집
    async function prefetchBgAudio(videoId) {
      prefetchedAudioCandidates = [];
      prefetchedVideoId = '';
      activeCandidateIdx = 0;
      updateBgModeUI();

      const candidates = [];
      const addUnique = (u) => {
        if (u && typeof u === 'string' && !candidates.includes(u)) candidates.push(u);
      };

      // 1순위: Piped 다중 서버 (M4A AAC + iOS 네이티브 HLS .m3u8)
      for (const server of STREAM_PIPED_SERVERS) {
        if (currentVideoId !== videoId) return [];
        try {
          const data = await fetchJsonWithTimeout(`${server}/streams/${videoId}`, 5000);
          const streams = (data.audioStreams || []).filter(s => s && s.url);
          const mp4 = streams
            .filter(s => /mp4|m4a/i.test(s.mimeType || '') || /mp4a/i.test(s.codec || ''))
            .sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
          mp4.forEach(s => addUnique(s.url));
          if (data.hls) addUnique(data.hls); // iOS Safari/PWA 네이티브 HLS 초강력 지원
          if (candidates.length > 0) break;
        } catch (e) {}
      }

      // 2순위: Invidious 다중 서버 프록시 폴백 (local=true로 모바일 IP 차단 우회)
      if (candidates.length === 0) {
        for (const inv of STREAM_INVIDIOUS_SERVERS) {
          if (currentVideoId !== videoId) return [];
          try {
            const data = await fetchJsonWithTimeout(`${inv}/api/v1/videos/${videoId}?fields=adaptiveFormats,formatStreams`, 5500);
            const adapt = (data.adaptiveFormats || [])
              .filter(f => /audio\/mp4/i.test(f.type || ''))
              .sort((a, b) => Number(b.bitrate || 0) - Number(a.bitrate || 0));
            adapt.forEach(f => {
              if (f.itag) addUnique(`${inv}/latest_version?id=${videoId}&itag=${f.itag}&local=true`);
            });
            const fmts = (data.formatStreams || []).filter(f => /video\/mp4/i.test(f.type || ''));
            fmts.forEach(f => {
              if (f.itag) addUnique(`${inv}/latest_version?id=${videoId}&itag=${f.itag}&local=true`);
            });
            if (candidates.length > 0) break;
          } catch (e) {}
        }
      }

      if (currentVideoId !== videoId) return [];
      prefetchedAudioCandidates = candidates;
      prefetchedVideoId = candidates.length > 0 ? videoId : '';
      updateBgModeUI();

      // 이미 책갈피로 날린 상태에서 스트림이 도착했다면 자동 백그라운드 핸드오프 시도
      if (isDockedToBookmark && !isBgAudioPlaying && candidates.length > 0) {
        activateBgAudioStream(lastKnownPlaySec);
      }
      return candidates;
    }

    // 무중단 백그라운드 오디오 전환 (실제 'playing' 확인 전까지 YouTube iframe 절대 정지 안 함!)
    async function activateBgAudioStream(startSec = 0) {
      if (!currentVideoId) return false;
      if (prefetchedVideoId !== currentVideoId || prefetchedAudioCandidates.length === 0) {
        statusMsg.innerText = '백그라운드 오디오 스트림 연결 중...';
        if (prefetchPromise) await prefetchPromise;
        if (prefetchedVideoId !== currentVideoId || prefetchedAudioCandidates.length === 0) {
          await prefetchBgAudio(currentVideoId);
        }
      }
      if (prefetchedAudioCandidates.length === 0) {
        statusMsg.innerText = '공용 스트림 지연 · 인앱 책갈피 재생 유지 중';
        return false;
      }

      activeCandidateIdx = 0;
      userPausedBg = false;
      pendingBgSeekSec = Math.floor(startSec || 0);
      return tryPlayCandidateAt(0);
    }

    function tryPlayCandidateAt(idx) {
      if (idx >= prefetchedAudioCandidates.length) {
        isBgAudioPlaying = false;
        updateBgModeUI();
        statusMsg.innerText = '오디오 스트림 전환 지연 · 기존 재생 유지';
        return false;
      }
      activeCandidateIdx = idx;
      try {
        bgAudio.muted = false;
        bgAudio.src = prefetchedAudioCandidates[idx];
        const p = bgAudio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {
            tryPlayCandidateAt(idx + 1);
          });
        }
        return true;
      } catch (e) {
        return tryPlayCandidateAt(idx + 1);
      }
    }

    // 재생창 하단 [🎧] 원터치 백그라운드 오디오 모드 토글
    function toggleBgAudioMode() {
      if (!currentVideoId) return;
      unlockIosAudioOnce();

      if (isBgAudioPlaying) {
        // BG 오디오 -> YouTube 영상 모드로 복귀
        const resumeSec = Math.floor(bgAudio.currentTime || lastKnownPlaySec || 0);
        lastKnownPlaySec = resumeSec;
        stopBgAudioClean();
        sendYtCommand('seekTo', [resumeSec, true]);
        sendYtCommand('playVideo');
        statusMsg.innerText = '영상 모드로 복귀';
      } else {
        // YouTube 영상 -> iOS 백그라운드 오디오 모드로 즉시 전환
        activateBgAudioStream(lastKnownPlaySec);
      }
    }

    function toggleBgAudioPlayPause() {
      if (!isBgAudioPlaying) return;
      if (bgAudio.paused) {
        userPausedBg = false;
        bgAudio.play().catch(() => {});
      } else {
        userPausedBg = true;
        bgAudio.pause();
      }
      updateBgModeUI();
    }

    function openPlayerModal(videoId, title) {
      unlockIosAudioOnce(); // iOS Safari/PWA 오디오 세션 선행 잠금해제!
      stopBgAudioClean();
      isDockedToBookmark = false;
      lastKnownPlaySec = 0;
      miniBookmark.style.display = 'none';

      currentVideoTitle = title;

      modal.style.left = `${Math.max(6, Math.round((window.innerWidth - dims.width) / 2))}px`;
      modal.style.top = `${Math.max(48, Math.round((window.innerHeight - (dims.height + 24)) / 2))}px`;

      ytHolder.innerHTML = `
        <iframe
          id="ytPlayerFrame"
          src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&controls=1&fs=1&enablejsapi=1&modestbranding=1&rel=0&playsinline=1&iv_load_policy=3&cc_load_policy=0&disablekb=1"

      hideYtPauseMask();

    // 5-2. Firebase 3필드 100% 호환 스키마({keyword, updatedAt, items}) + 진단 + 최종 피드 신속 복원
    function updateDbDiagUI() {
      const el = document.getElementById('dbDiagText');
      if (!el) return;
      if (fbVerified) {
        el.textContent = 'DB 상태: Firebase 정상 연동됨';
        el.style.color = '#4ade80';
      } else {
        el.textContent = lastDbErrorMsg ? `DB 오류: ${lastDbErrorMsg}` : 'DB 상태: 미연동 (재연결 클릭)';
        el.style.color = '#ff7777';
      }
    }

    function recordDbError(err) {
      fbVerified = false;
      const code = err && err.code ? String(err.code) : '';
      const msg = err && err.message ? String(err.message) : String(err || 'unknown');
      lastDbErrorMsg = code ? `${code}` : msg.slice(0, 48);
      updateSearchBtnState();
      updateDbDiagUI();
    }

    function markDbHealthy() {
      fbVerified = true;
      lastDbErrorMsg = '';
      updateSearchBtnState();
      updateDbDiagUI();
    }

    function initFirebaseAlways() {
      if (typeof firebase === 'undefined') {
        fbReady = false;
        recordDbError({ code: 'sdk-not-loaded' });
        return;
      }
      try {
        if (!firebase.apps || firebase.apps.length === 0) {
          firebase.initializeApp(DEFAULT_FIREBASE_CONFIG);
        }
        db = firebase.firestore();
        fbReady = true;
      } catch (err) {
        fbReady = false;
        db = null;
        recordDbError(err);
      }
    }

    async function verifyFirebaseConnection() {
      if (!fbReady || !db) {
        initFirebaseAlways();
        if (!fbReady || !db) return false;
      }
      try {
        const snap = await Promise.race([
          db.collection(FB_COLLECTION).doc(AUTH_DOC_ID).get(),
          new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 7000))
        ]);
        markDbHealthy();
        if (snap && snap.exists) {
          parseAuthDocData(snap.data());
        }
        return true;
      } catch (err) {
        recordDbError(err);
        return false;
      }
    }

    function parseAuthDocData(d) {
      if (!d) return;
      if (Array.isArray(d.items)) {
        const adminEntry = d.items.find(it => it && it.id === '__admin__');
        const userEntries = d.items.filter(it => it && it.id && it.id !== '__admin__' && it.code);
        authData = {
          adminCode: String((adminEntry && adminEntry.code) || d.adminCode || DEFAULT_ADMIN_CODE),
          users: userEntries
        };
      } else {
        authData = {
          adminCode: String(d.adminCode || DEFAULT_ADMIN_CODE),
          users: Array.isArray(d.users) ? d.users : []
        };
      }
      saveLocalAuthCache();
    }

    function loadLocalMetaBackup() {
      if (!currentUser) return [];
      try {
        const raw = localStorage.getItem(META_BACKUP_PREFIX + getUid());
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) return arr.filter(t => t && t.docId && !/^__.*__$/.test(String(t.docId)) && !String(t.docId).startsWith('sys_'));
        }
      } catch (e) {}
      return [];
    }

    function saveLocalMetaBackup(metaList) {
      if (!currentUser) return;
      try {
        localStorage.setItem(META_BACKUP_PREFIX + getUid(), JSON.stringify(metaList || []));
      } catch (e) {}
    }

    function getPendingSyncIds() {
      if (!currentUser) return [];
      try {
        const raw = localStorage.getItem(PENDING_SYNC_PREFIX + getUid());
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }

    function markPendingSync(docId) {
      if (!currentUser || !docId) return;
      const list = Array.from(new Set([...getPendingSyncIds(), docId]));
      try { localStorage.setItem(PENDING_SYNC_PREFIX + getUid(), JSON.stringify(list)); } catch (e) {}
    }

    function clearPendingSync(docId) {
      if (!currentUser || !docId) return;
      const list = getPendingSyncIds().filter(id => id !== docId);
      try { localStorage.setItem(PENDING_SYNC_PREFIX + getUid(), JSON.stringify(list)); } catch (e) {}
    }

    function loadLocalAuthCache() {
      try {
        const raw = localStorage.getItem(AUTH_CACHE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.adminCode) {
            authData = {
              adminCode: String(parsed.adminCode),
              users: Array.isArray(parsed.users) ? parsed.users : []
            };
          }
        }
      } catch (e) {}
    }

    function saveLocalAuthCache() {
      try { localStorage.setItem(AUTH_CACHE_KEY, JSON.stringify(authData)); } catch (e) {}
    }

    async function loadAuthConfigFromCloud() {
      loadLocalAuthCache();
      if (!fbReady || !db) {
        recordDbError({ code: 'not-initialized' });
        return;
      }
      try {
        const snap = await db.collection(FB_COLLECTION).doc(AUTH_DOC_ID).get();
        markDbHealthy();
        if (snap.exists) {
          parseAuthDocData(snap.data());
        } else {
          await saveAuthConfigToCloud();
        }
      } catch (err) {
        recordDbError(err);
      }
    }

    // 기존 V6 Firestore 규칙 100% 호환 3필드({keyword, updatedAt, items}) 저장
    async function saveAuthConfigToCloud() {
      saveLocalAuthCache();
      if (!fbReady || !db) return;
      try {
        const itemsPayload = [
          { id: '__admin__', code: String(authData.adminCode || DEFAULT_ADMIN_CODE) },
          ...(authData.users || []).map(u => ({
            id: String(u.id),
            name: String(u.name || ''),
            code: String(u.code || ''),
            createdAt: Number(u.createdAt || 0)
          }))
        ];
        await db.collection(FB_COLLECTION).doc(AUTH_DOC_ID).set({
          keyword: AUTH_DOC_ID,
          updatedAt: Date.now(),
          items: itemsPayload
        });
        markDbHealthy();
      } catch (err) {
        recordDbError(err);
      }
    }

    function findUserByCode(code) {
      const clean = String(code || '').trim();
      if (!clean) return null;
      if (clean === String(authData.adminCode || DEFAULT_ADMIN_CODE)) {
        return { role: 'admin', id: 'admin', name: '관리자', code: clean };
      }
      const matched = (authData.users || []).find(u => u && String(u.code) === clean);
      if (matched) {
        return { role: 'user', id: matched.id, name: matched.name || matched.id, code: matched.code };
      }
      return null;
    }

    function showAuthGate(errText = '') {
      document.body.classList.add('auth-locked');
      const inp = document.getElementById('authCodeInput');
      const errEl = document.getElementById('authGateErr');
      if (errEl) errEl.textContent = errText;
      if (inp) {
        inp.value = '';
        setTimeout(() => inp.focus(), 60);
      }
    }

    async function submitAuthCode() {
      const inp = document.getElementById('authCodeInput');
      const errEl = document.getElementById('authGateErr');
      const code = inp ? inp.value.trim() : '';
      if (!code) {
        if (errEl) errEl.textContent = '코드를 입력하세요';
        return;
      }
      if (errEl) errEl.textContent = '';

      await loadAuthConfigFromCloud();
      const user = findUserByCode(code);
      if (!user) {
        if (errEl) errEl.textContent = '유효하지 않은 코드입니다';
        if (inp) { inp.value = ''; inp.focus(); }
        return;
      }
      enterAppWithUser(user);
    }

    // 최종 시청 피드 저장 & 최초 접속 시 신속 자동 복원
    function loadLocalLastViewedFeed() {
      if (!currentUser) return null;
      try {
        const raw = localStorage.getItem(LAST_FEED_STORAGE_PREFIX + getUid());
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.docId && parsed.keyword) return parsed;
        }
      } catch (e) {}
      return null;
    }

    function saveLastViewedFeed(docId, keyword) {
      if (!currentUser || !docId || !keyword) return;
      lastViewedFeed = { docId, keyword, at: Date.now() };
      try {
        localStorage.setItem(LAST_FEED_STORAGE_PREFIX + getUid(), JSON.stringify(lastViewedFeed));
      } catch (e) {}
      saveUserProfileDocToCloud();
    }

    async function restoreLastViewedFeed(forceFromCloud = false) {
      if (!currentUser || isSearching) return;
      const target = lastViewedFeed || loadLocalLastViewedFeed() || (cachedTabsMeta[0] ? {
        docId: cachedTabsMeta[0].docId,
        keyword: cachedTabsMeta[0].keyword,
        at: cachedTabsMeta[0].updatedAt || 0
      } : null);

      if (!target || !target.docId) return;
      if (!forceFromCloud && activeTabKeyword === target.keyword && currentFeedItems.length > 0) return;

      await loadTabData(target.docId, target.keyword, false);
    }

    async function enterAppWithUser(user) {
      currentUser = user;
      try {
        localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
          id: user.id,
          role: user.role,
          code: user.code
        }));
      } catch (e) {}

      document.body.classList.remove('auth-locked');
      activeTabKeyword = '';
      currentFeedItems = [];
      dbFeedPool = [];
      activeSearchSession = null;
      totalLoadedItems = 0;
      resultsContainer.innerHTML = '';
      document.getElementById('query').value = '';
      statusMsg.innerText = '';

      initSavedBgColor();
      loadLocalPinsImmediate();
      lastViewedFeed = loadLocalLastViewedFeed();
      updateSearchBtnState();

      // 1단계: 로컬 스냅샷으로 최종 보던 피드 0.01초 즉시 복원
      if (lastViewedFeed) {
        const fastCached = getCachedTab(lastViewedFeed.docId);
        if (fastCached && fastCached.items.length > 0) {
          renderDbTabItems(fastCached.items, lastViewedFeed.keyword);
        }
      }

      // 2단계: Firebase에서 프로필(테마·최종피드·재생이력) + 별표 + 검색목차 병렬 동기화
      await Promise.all([
        loadUserProfileFromCloud(),
        syncPinsFromFirebase(),
        loadSavedTabsMeta()
      ]);

      // 3단계: Firebase 기준 최종 시청 피드가 갱신되었거나 화면이 비어있다면 신속 로드
      await restoreLastViewedFeed(currentFeedItems.length === 0);
    }

    function logoutUser() {
      closePlayerModal();
      closeManageModal();
      currentUser = null;
      cachedTabsMeta = [];
      currentFeedItems = [];
      dbFeedPool = [];
      activeSearchSession = null;
      currentPlayHistory = [];
      lastViewedFeed = null;
      pinnedVideoIds = new Set();
      memoryTabCache.clear();
      activeTabKeyword = '';
      resultsContainer.innerHTML = '';
      savedTabsList.innerHTML = '';
      document.getElementById('query').value = '';
      statusMsg.innerText = '';
      updateScrollSentinelUI();
      try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
      showAuthGate('');
    }

    // 사용자 프로필 통합 저장 (기존 3필드 스키마 {keyword, updatedAt, items} 100% 준수!)
    async function saveUserProfileDocToCloud() {
      if (!fbReady || !db || !currentUser) return;
      const packedItems = [];
      packedItems.push({ id: '__theme__', data: currentThemeColors });
      if (lastViewedFeed && lastViewedFeed.docId) {
        packedItems.push({
          id: '__last_feed__',
          docId: lastViewedFeed.docId,
          keyword: lastViewedFeed.keyword,
          at: lastViewedFeed.at || Date.now()
        });
      }
      (currentPlayHistory || []).slice(0, 30).forEach(it => {
        if (it && it.id && !String(it.id).startsWith('__')) {
          packedItems.push({ id: it.id, t: it.t || '', at: Number(it.at || 0) });
        }
      });

      try {
        await db.collection(FB_COLLECTION).doc(getPlayInfoDocId()).set({
          keyword: getPlayInfoDocId(),
          updatedAt: Date.now(),
          items: packedItems
        });
        markDbHealthy();
      } catch (err) {
        recordDbError(err);
      }
    }

    async function loadUserProfileFromCloud() {
      currentPlayHistory = [];
      if (!currentUser) return;
      try {
        const raw = localStorage.getItem(PLAY_HISTORY_LOCAL_PREFIX + getUid());
        if (raw) {
          const arr = JSON.parse(raw);
          if (Array.isArray(arr)) currentPlayHistory = arr;
        }
      } catch (e) {}

      if (!fbReady || !db) return;
      try {
        const snap = await db.collection(FB_COLLECTION).doc(getPlayInfoDocId()).get();
        markDbHealthy();
        if (snap.exists) {
          const d = snap.data();
          const list = Array.isArray(d.items) ? d.items : [];
          const themeEntry = list.find(it => it && it.id === '__theme__' && it.data);
          const lastFeedEntry = list.find(it => it && it.id === '__last_feed__' && it.docId);
          const playItems = list.filter(it => it && it.id && !String(it.id).startsWith('__'));

          if (playItems.length > 0) {
            currentPlayHistory = playItems;
            localStorage.setItem(PLAY_HISTORY_LOCAL_PREFIX + getUid(), JSON.stringify(currentPlayHistory));
          }
          if (themeEntry && themeEntry.data) {
            Object.keys(THEME_MODULES).forEach(k => {
              if (themeEntry.data[k] && /^#[0-9a-fA-F]{6}$/.test(themeEntry.data[k])) {
                currentThemeColors[k] = themeEntry.data[k].toLowerCase();
              }
            });
            applyThemeColorsToDOM();
            persistThemeColors(false);
          } else if (d.bgColor && /^#[0-9a-fA-F]{6}$/.test(d.bgColor)) {
            currentThemeColors.appBg = d.bgColor.toLowerCase();
            applyThemeColorsToDOM();
          }
          if (lastFeedEntry && lastFeedEntry.docId) {
            const localAt = lastViewedFeed ? Number(lastViewedFeed.at || 0) : 0;
            if (Number(lastFeedEntry.at || 0) >= localAt) {
              lastViewedFeed = {
                docId: lastFeedEntry.docId,
                keyword: lastFeedEntry.keyword || lastFeedEntry.docId,
                at: Number(lastFeedEntry.at || Date.now())
              };
              localStorage.setItem(LAST_FEED_STORAGE_PREFIX + getUid(), JSON.stringify(lastViewedFeed));
            }
          }
        }
      } catch (err) {
        recordDbError(err);
      }
    }

    async function recordUserPlay(videoId, title) {
      if (!currentUser || !videoId) return;
      const cleanTitle = simplifyTitle(title);
      currentPlayHistory = [
        { id: videoId, t: cleanTitle, at: Date.now() },
        ...currentPlayHistory.filter(it => it && it.id !== videoId)
      ].slice(0, 30);

      try {
        localStorage.setItem(PLAY_HISTORY_LOCAL_PREFIX + getUid(), JSON.stringify(currentPlayHistory));
      } catch (e) {}
      await saveUserProfileDocToCloud();
    }

    async function syncTabsIndexToCloud() {
      saveLocalMetaBackup(cachedTabsMeta);
      if (!fbReady || !db || !currentUser) return false;
      try {
        const indexItems = cachedTabsMeta.slice(0, MAX_TAB_ITEMS).map(t => ({
          docId: t.docId,
          kw: t.keyword,
          cnt: t.count,
          at: t.updatedAt || Date.now()
        }));
        await db.collection(FB_COLLECTION).doc(getTabsIndexDocId()).set({
          keyword: getTabsIndexDocId(),
          updatedAt: Date.now(),
          items: indexItems
        });
        markDbHealthy();
        return true;
      } catch (err) {
        recordDbError(err);
        return false;
      }
    }

    function upsertLocalMeta(docId, keyword, count, updatedAt) {
      cachedTabsMeta = cachedTabsMeta.filter(t => t.docId !== docId);
      cachedTabsMeta.unshift({ docId, keyword, count, updatedAt });
      saveLocalMetaBackup(cachedTabsMeta);
      renderSavedTabsBar();
      if (manageOverlay.style.display === 'flex') renderManageList();
    }

    async function flushPendingTabsToCloud(missingMetaItems = []) {
      if (!fbReady || !db || !currentUser) return;
      const pendingSet = new Set(getPendingSyncIds());
      missingMetaItems.forEach(m => { if (m && m.docId) pendingSet.add(m.docId); });
      if (pendingSet.size === 0) return;

      let uploadedAny = false;
      for (const docId of pendingSet) {
        const cached = getCachedTab(docId);
        const meta = cachedTabsMeta.find(t => t.docId === docId);
        if (!cached || !Array.isArray(cached.items) || !meta) {
          clearPendingSync(docId);
          continue;
        }
        try {
          await db.collection(FB_COLLECTION).doc(docId).set({
            keyword: meta.keyword,
            updatedAt: meta.updatedAt || Date.now(),
            items: stripThumbField(cached.items)
          });
          clearPendingSync(docId);
          uploadedAny = true;
          markDbHealthy();
        } catch (err) {
          recordDbError(err);
        }
      }
      if (uploadedAny) await syncTabsIndexToCloud();
    }

    async function loadSavedTabsMeta() {
      if (!currentUser) return;

      const localMeta = loadLocalMetaBackup();
      if (localMeta.length > 0) {
        cachedTabsMeta = [...localMeta].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        renderSavedTabsBar();
      }

      if (!fbReady || !db) {
        recordDbError({ code: 'not-initialized' });
        return;
      }

      setWorkingState(true);
      try {
        const idxDocId = getTabsIndexDocId();
        const idxSnap = await db.collection(FB_COLLECTION).doc(idxDocId).get();
        markDbHealthy();

        let cloudMeta = [];
        if (idxSnap.exists && Array.isArray(idxSnap.data().items)) {
          cloudMeta = idxSnap.data().items
            .filter(it => it && it.docId && !String(it.docId).startsWith('__') && !String(it.docId).startsWith('sys_'))
            .map(it => ({
              docId: it.docId,
              keyword: it.kw || it.docId,
              count: Number(it.cnt || 0),
              updatedAt: Number(it.at || 0)
            }));
        } else {
          try {
            const snap = await db.collection(FB_COLLECTION).get();
            const userPrefix = `u_${getUid()}_`;
            snap.forEach(doc => {
              if (doc.id.startsWith('__') || doc.id.startsWith('sys_')) return;
              if (isAdminUser()) {
                if (doc.id.startsWith('u_')) return;
              } else {
                if (!doc.id.startsWith(userPrefix)) return;
              }
              const d = doc.data();
              cloudMeta.push({
                docId: doc.id,
                keyword: d.keyword || doc.id.replace(userPrefix, ''),
                count: Array.isArray(d.items) ? d.items.length : 0,
                updatedAt: d.updatedAt || 0
              });
            });
          } catch (listErr) {
            console.warn('[컬렉션 스캔 건너뜀]', listErr);
          }
        }

        const mergedMap = new Map();
        cloudMeta.forEach(t => mergedMap.set(t.docId, t));
        const missingInCloud = [];
        localMeta.forEach(lt => {
          const ct = mergedMap.get(lt.docId);
          if (!ct || (lt.updatedAt || 0) > (ct.updatedAt || 0)) {
            mergedMap.set(lt.docId, lt);
            missingInCloud.push(lt);
          }
        });

        cachedTabsMeta = Array.from(mergedMap.values()).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
        saveLocalMetaBackup(cachedTabsMeta);
        renderSavedTabsBar();
        if (manageOverlay.style.display === 'flex') renderManageList();

        if (missingInCloud.length > 0 || getPendingSyncIds().length > 0) {
          await flushPendingTabsToCloud(missingInCloud);
        } else if (!idxSnap.exists && cachedTabsMeta.length > 0) {
          await syncTabsIndexToCloud();
        }
      } catch (err) {
        recordDbError(err);
      } finally {
        setWorkingState(false);
      }
    }

    function renderSavedTabsBar() {
      savedTabsList.innerHTML = '';
      cachedTabsMeta.forEach(tab => {
        const btn = document.createElement('button');
        btn.className = 'history-tab' + (activeTabKeyword === tab.keyword ? ' active' : '');
        btn.onclick = () => loadTabData(tab.docId, tab.keyword, true);

        const label = document.createElement('span');
        label.textContent = tab.keyword;
        const badge = document.createElement('span');
        badge.className = 'tab-count-badge';
        badge.textContent = tab.count;

        btn.appendChild(label);
        btn.appendChild(badge);
        savedTabsList.appendChild(btn);
      });
    }

    function mergeAndCapItems(newItems, existingItems) {
      const dedupMap = new Map();
      (newItems || []).forEach(it => {
        if (it.id && !dedupMap.has(it.id)) dedupMap.set(it.id, it);
      });
      (existingItems || []).forEach(it => {
        if (it.id && !dedupMap.has(it.id)) dedupMap.set(it.id, it);
      });
      return Array.from(dedupMap.values()).slice(0, MAX_TAB_ITEMS);
    }

    async function saveSearchTab(keyword, newItems) {
      if (!currentUser) return;
      const docId = getSearchTabDocId(keyword);
      const now = Date.now();
      const cleanNew = stripThumbField(newItems);

      let existingItems = [];
      const meta = cachedTabsMeta.find(t => t.docId === docId);
      const cached = getCachedTab(docId);

      if (cached && (!meta || cached.updatedAt >= meta.updatedAt)) {
        existingItems = cached.items;
      } else if (fbReady && db && meta) {
        try {
          const snap = await db.collection(FB_COLLECTION).doc(docId).get();
          if (snap.exists && Array.isArray(snap.data().items)) {
            existingItems = stripThumbField(snap.data().items);
          }
        } catch (e) {}
      }

      const trimmedItems = stripThumbField(mergeAndCapItems(cleanNew, existingItems));
      activeTabKeyword = keyword;

      setCachedTab(docId, now, trimmedItems);
      upsertLocalMeta(docId, keyword, trimmedItems.length, now);
      markPendingSync(docId);

      if (!fbReady || !db) {
        recordDbError({ code: 'not-initialized' });
        return;
      }

      try {
        await db.collection(FB_COLLECTION).doc(docId).set({
          keyword: keyword,
          updatedAt: now,
          items: trimmedItems
        });
        clearPendingSync(docId);
        markDbHealthy();
        await syncTabsIndexToCloud();
      } catch (err) {
        recordDbError(err);
      }
    }

    function renderDbTabItems(items, keyword) {
      activeTabKeyword = keyword;
      document.getElementById('query').value = keyword;
      totalLoadedItems = 0;
      currentFeedItems = [];
      activeSearchSession = null;
      dbFeedPool = stripThumbField(items).slice(0, MAX_TAB_ITEMS);
      resultsContainer.innerHTML = '';

      const firstChunk = dbFeedPool.slice(0, CHUNK_SIZE);
      const seenIds = new Set();
      appendChunkItems(firstChunk, CHUNK_SIZE, seenIds, true, false);
      renderSavedTabsBar();
      statusMsg.innerText = '';
      updateScrollSentinelUI();
    }

    async function loadTabData(docId, keyword, shouldSaveLast = true) {
      if (isSearching || !currentUser) return;
      let items = [];
      const meta = cachedTabsMeta.find(t => t.docId === docId);
      const cached = getCachedTab(docId);

      if (cached && cached.items.length > 0 && (!meta || cached.updatedAt >= meta.updatedAt)) {
        items = cached.items;
      } else if (fbReady && db) {
        setWorkingState(true);
        try {
          const snap = await db.collection(FB_COLLECTION).doc(docId).get();
          markDbHealthy();
          if (!snap.exists) {
            removeCachedTab(docId);
            cachedTabsMeta = cachedTabsMeta.filter(t => t.docId !== docId);
            saveLocalMetaBackup(cachedTabsMeta);
            renderSavedTabsBar();
            syncTabsIndexToCloud();
            return;
          }
          const data = snap.data();
          items = stripThumbField(Array.isArray(data.items) ? data.items : []);
          setCachedTab(docId, data.updatedAt || Date.now(), items);
        } catch (err) {
          recordDbError(err);
          if (cached && cached.items.length > 0) {
            items = cached.items;
          } else {
            statusMsg.innerText = `불러오기 실패 (${lastDbErrorMsg})`;
            return;
          }
        } finally {
          setWorkingState(false);
        }
      } else if (cached && cached.items.length > 0) {
        items = cached.items;
      }

      if (items.length === 0) return;
      renderDbTabItems(items, keyword);
      if (shouldSaveLast) {
        saveLastViewedFeed(docId, keyword);
      }
    }

    async function registerNewUser() {
      if (!isAdminUser()) return;
      const nameInp = document.getElementById('newUserNameInput');
      const codeInp = document.getElementById('newUserCodeInput');
      const name = nameInp ? nameInp.value.trim() : '';

    async function trimTabHalf(docId, keyword) {
      if (!currentUser) return;
      const now = Date.now();
      const cached = getCachedTab(docId);
      let items = cached ? cached.items : null;
      if (!items && fbReady && db) {
        try {
          const snap = await db.collection(FB_COLLECTION).doc(docId).get();
          if (snap.exists) items = Array.isArray(snap.data().items) ? snap.data().items : [];
        } catch (e) {}
      }
      if (!items) return;

      const keepCount = Math.max(10, Math.floor(items.length / 2));
      const trimmed = stripThumbField(items.slice(0, keepCount));

      setCachedTab(docId, now, trimmed);
      upsertLocalMeta(docId, keyword, trimmed.length, now);
      if (fbReady && db) {
        try {
          await db.collection(FB_COLLECTION).doc(docId).set({
            keyword: keyword,
            items: trimmed,
            updatedAt: now
          });
          await syncTabsIndexToCloud();
        } catch (err) {
          markPendingSync(docId);
          recordDbError(err);
        }
      }
    }

    async function deleteTabDoc(docId, keyword) {
      if (!currentUser) return;
      if (!confirm(`'${keyword}' 목록을 삭제할까요?`)) return;
      removeCachedTab(docId);
      clearPendingSync(docId);
      cachedTabsMeta = cachedTabsMeta.filter(t => t.docId !== docId);
      saveLocalMetaBackup(cachedTabsMeta);
      if (activeTabKeyword === keyword) activeTabKeyword = '';
      renderSavedTabsBar();
      if (manageOverlay.style.display === 'flex') renderManageList();

      if (fbReady && db) {
        try {
          await db.collection(FB_COLLECTION).doc(docId).delete();
          await syncTabsIndexToCloud();
        } catch (err) {
          recordDbError(err);
        }
      }
    }

    async function extractDirectAudio() {
      if (!currentVideoId) return;
      directStreamBtn.innerText = "음원 스트림 추출 중...";
      try {
        const { data } = await smartFetch(`/streams/${currentVideoId}`);
        // 최고 음질 오디오 스트림 선별
        const sortedAudio = (data.audioStreams || []).sort((a, b) => (b.bitrate || 0) - (a.bitrate || 0));
        const bestStream = sortedAudio[0];

        if (bestStream && bestStream.url) {
          const a = document.createElement('a');
          a.href = bestStream.url;
          a.target = '_blank';
          a.download = `${currentVideoTitle}.mp3`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          directStreamBtn.innerText = "✓ 추출 완료 (새 창에서 저장)";
        } else {
          throw new Error();
        }
      } catch (e) {
        directStreamBtn.innerText = "위 빨간색 MP3 변환 버튼을 눌러 저장하세요";
      }
    }

    // 7. YouTube 재생 상태/초 수신 + '동영상 더보기' 차단 + 검색버튼 흰색 삼각형 깜박임 연동
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data !== 'string') return;
      try {
        const msg = JSON.parse(e.data);
        if (msg.event === 'infoDelivery' && msg.info) {
          if (typeof msg.info.currentTime === 'number') {
            lastKnownPlaySec = msg.info.currentTime;
          }
          if (typeof msg.info.playerState === 'number') {
            if (msg.info.playerState === 1) {
              isYtVideoPlaying = true;
              hideYtPauseMask();
              updateSearchBtnState();
            } else if (msg.info.playerState === 2 || msg.info.playerState === 0) {
              isYtVideoPlaying = false;
              if (!isBgAudioPlaying && !isDockedToBookmark && currentVideoId) {
                showYtPauseMask();
              }
              updateSearchBtnState();
            }
          }
        }
      } catch (err) {}
    });

    bgAudio.addEventListener('loadedmetadata', () => {
      if (bgAudio.src === SILENT_WAV_URI) return;
      if (pendingBgSeekSec > 0 && isFinite(bgAudio.duration) && pendingBgSeekSec < bgAudio.duration) {
        try { bgAudio.currentTime = pendingBgSeekSec; } catch (e) {}
      }
      pendingBgSeekSec = 0;
    });

    bgAudio.addEventListener('playing', () => {
      if (bgAudio.src === SILENT_WAV_URI) return;
      isBgAudioPlaying = true;
      hideYtPauseMask();
      sendYtCommand('pauseVideo');
      setupMediaSession(currentVideoTitle, currentVideoId);
      if ('mediaSession' in navigator) {
        try { navigator.mediaSession.playbackState = 'playing'; } catch (e) {}
      }
      updateBgModeUI();
      updateSearchBtnState();
    });

    bgAudio.addEventListener('pause', () => {
      if (bgAudio.src === SILENT_WAV_URI) return;
      if ('mediaSession' in navigator && isBgAudioPlaying) {
        try { navigator.mediaSession.playbackState = 'paused'; } catch (e) {}
      }
      updateBgModeUI();
      updateSearchBtnState();
    });

    bgAudio.addEventListener('timeupdate', () => {
      if (!isBgAudioPlaying || bgAudio.src === SILENT_WAV_URI) return;
      lastKnownPlaySec = bgAudio.currentTime || lastKnownPlaySec;
      if (bgTimeText) {
        bgTimeText.textContent = `${formatSec(bgAudio.currentTime)} / ${formatSec(bgAudio.duration)}`;
      }
      if ('mediaSession' in navigator && isFinite(bgAudio.duration) && bgAudio.duration > 0) {
        try {
          navigator.mediaSession.setPositionState({
            duration: bgAudio.duration,
            playbackRate: bgAudio.playbackRate || 1,
            position: Math.min(bgAudio.currentTime, bgAudio.duration)
          });
        } catch (e) {}
      }
    });

    bgAudio.addEventListener('error', () => {
      if (!currentVideoId || bgAudio.src === SILENT_WAV_URI || !bgAudio.src) return;
      if (activeCandidateIdx + 1 < prefetchedAudioCandidates.length) {
        tryPlayCandidateAt(activeCandidateIdx + 1);
      } else {
        isBgAudioPlaying = false;
        updateBgModeUI();
        updateSearchBtnState();
      }
    });

    bgAudio.addEventListener('ended', () => {
      isBgAudioPlaying = false;
      updateBgModeUI();
      updateSearchBtnState();
    });

    // 브라우저/홈화면 앱이 백그라운드로 내려갈 때 자동 오디오 보호
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden' && currentVideoId) {
        if (isBgAudioPlaying && bgAudio.paused && !userPausedBg) {
          bgAudio.play().catch(() => {});
        } else if (!isBgAudioPlaying && !userPausedBg && iosAudioUnlocked && prefetchedVideoId === currentVideoId && prefetchedAudioCandidates.length > 0) {
          activateBgAudioStream(lastKnownPlaySec);
        }
      }
    });

    // 책갈피 위치 저장 상태
    let savedBookmarkPos = null; // { mode: 'left'|'right'|'free', left, top }

    function applyBookmarkPosition(defaultSide) {
      miniBookmark.classList.remove('dock-left', 'dock-right', 'dock-free');
      if (savedBookmarkPos) {
        if (savedBookmarkPos.mode === 'left') {
          miniBookmark.classList.add('dock-left');
          miniBookmark.style.left = '0px';
          miniBookmark.style.right = 'auto';
          miniBookmark.style.top = `${savedBookmarkPos.top}px`;
        } else if (savedBookmarkPos.mode === 'right') {
          miniBookmark.classList.add('dock-right');
          miniBookmark.style.left = 'auto';
          miniBookmark.style.right = '0px';
          miniBookmark.style.top = `${savedBookmarkPos.top}px`;
        } else {
          miniBookmark.classList.add('dock-free');
          miniBookmark.style.left = `${savedBookmarkPos.left}px`;
          miniBookmark.style.right = 'auto';
          miniBookmark.style.top = `${savedBookmarkPos.top}px`;
        }
      } else {
        const side = defaultSide === 'left' ? 'left' : 'right';
        miniBookmark.classList.add(side === 'left' ? 'dock-left' : 'dock-right');
        miniBookmark.style.left = side === 'left' ? '0px' : 'auto';
        miniBookmark.style.right = side === 'right' ? '0px' : 'auto';
        miniBookmark.style.top = '43%';
      }
    }

    // 화면 바깥으로 날리기 -> 연분홍 60% 소형 음표 책갈피 도킹 + 무중단 백그라운드 오디오 핸드오프
    function dockPlayerToBookmark(side) {
      lastWindowWidth = modal.offsetWidth || lastWindowWidth || 320;
      isDockedToBookmark = true;
      dockSide = side === 'left' ? 'left' : 'right';

      modal.classList.add('docked-hidden');
      applyBookmarkPosition(dockSide);
      miniBookmark.style.display = 'flex';
      updateBgModeUI();

      // 이미 백그라운드 오디오 재생 중이면 그대로 유지, 아니면 무중단 전환 시도
      if (!isBgAudioPlaying) {
        if (prefetchedVideoId === currentVideoId && prefetchedAudioCandidates.length > 0) {
          activateBgAudioStream(lastKnownPlaySec);
        } else {
          statusMsg.innerText = '음표 책갈피 모드 (터치: 정중앙 복귀 / 길게 눌러 이동)';
        }
      }
    }

    // 연분홍 음표 책갈피 짧은 터치 -> 화면 정중앙 복귀
    function restorePlayerFromBookmark() {
      isDockedToBookmark = false;
      miniBookmark.style.display = 'none';
      modal.classList.remove('docked-hidden', 'interacting');
      modal.style.display = 'block';

      const dims = apply16by9Scale(lastWindowWidth || 320);
      const centerLeft = Math.max(6, Math.round((window.innerWidth - dims.width) / 2));
      const centerTop = Math.max(52, Math.round((window.innerHeight - (dims.height + 24)) / 2));
      modal.style.left = `${centerLeft}px`;
      modal.style.top = `${centerTop}px`;
      updateBgModeUI();
    }

    // 음표 책갈피 제스처 컨트롤러 (짧은 터치: 정중앙 복귀 / 0.24초 길게 누름: 좌·우·상·하 자유 이동)
    let bmPressTimer = null;
    let bmIsDragging = false;
    let bmStartX = 0, bmStartY = 0, bmInitLeft = 0, bmInitTop = 0;

    miniBookmark.addEventListener('contextmenu', (e) => e.preventDefault());

    miniBookmark.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      try { miniBookmark.setPointerCapture(e.pointerId); } catch (err) {}

      const rect = miniBookmark.getBoundingClientRect();
      bmStartX = e.clientX;
      bmStartY = e.clientY;
      bmInitLeft = rect.left;
      bmInitTop = rect.top;
      bmIsDragging = false;

      clearTimeout(bmPressTimer);
      bmPressTimer = setTimeout(() => {
        bmIsDragging = true;
        miniBookmark.classList.add('dragging-bookmark');
        if (navigator.vibrate) { try { navigator.vibrate(15); } catch (err) {} }
      }, 240);
    });

    miniBookmark.addEventListener('pointermove', (e) => {
      const dx = e.clientX - bmStartX;
      const dy = e.clientY - bmStartY;

      if (!bmIsDragging) {
        if (Math.hypot(dx, dy) > 14) {
          clearTimeout(bmPressTimer);
        }
        return;
      }

      const maxLeft = window.innerWidth - 30;
      const maxTop = window.innerHeight - 40;
      const newLeft = Math.max(0, Math.min(maxLeft, bmInitLeft + dx));
      const newTop = Math.max(44, Math.min(maxTop, bmInitTop + dy));

      miniBookmark.style.left = `${newLeft}px`;
      miniBookmark.style.right = 'auto';
      miniBookmark.style.top = `${newTop}px`;

      miniBookmark.classList.remove('dock-left', 'dock-right', 'dock-free');
      if (newLeft <= 22) miniBookmark.classList.add('dock-left');
      else if (newLeft >= maxLeft - 22) miniBookmark.classList.add('dock-right');
      else miniBookmark.classList.add('dock-free');
    });

    function finishBookmarkPointer(e) {
      clearTimeout(bmPressTimer);
      if (bmIsDragging) {
        bmIsDragging = false;
        miniBookmark.classList.remove('dragging-bookmark');

        const rect = miniBookmark.getBoundingClientRect();
        const maxLeft = window.innerWidth - 30;
        const clampedTop = Math.max(44, Math.min(window.innerHeight - 40, Math.round(rect.top)));

        miniBookmark.classList.remove('dock-left', 'dock-right', 'dock-free');
        if (rect.left <= 22) {
          savedBookmarkPos = { mode: 'left', left: 0, top: clampedTop };
        } else if (rect.left >= maxLeft - 22) {
          savedBookmarkPos = { mode: 'right', left: maxLeft, top: clampedTop };
        } else {
          savedBookmarkPos = { mode: 'free', left: Math.round(rect.left), top: clampedTop };
        }
        applyBookmarkPosition(dockSide);
      } else if (e.type === 'pointerup') {
        const dx = e.clientX - bmStartX;
        const dy = e.clientY - bmStartY;
        if (Math.hypot(dx, dy) <= 14) {
          restorePlayerFromBookmark();
        }
      }
    }

    miniBookmark.addEventListener('pointerup', finishBookmarkPointer);
    miniBookmark.addEventListener('pointercancel', finishBookmarkPointer);

    // 7-2. 자유 드래그 이동 & 화면 밖 날리기(Flick/Slide Off-Screen)
    let isDragging = false;
    let startX = 0, startY = 0, initLeft = 0, initTop = 0;
    let lastMoveX = 0, lastMoveTime = 0, velocityX = 0;

    function startPlayerDrag(e) {
      if (isResizing) return;
      isDragging = true;
      modal.classList.add('interacting');
      if (e.currentTarget && e.currentTarget.setPointerCapture) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
      }
      startX = e.clientX;
      startY = e.clientY;
      initLeft = modal.offsetLeft;
      initTop = modal.offsetTop;
      lastMoveX = e.clientX;
      lastMoveTime = Date.now();
      velocityX = 0;
      e.preventDefault();
    }

    playerDragBar.addEventListener('pointerdown', startPlayerDrag);
    bottomDragSpacer.addEventListener('pointerdown', startPlayerDrag);

    // 8. 4각 모서리 16:9 정밀 확대/축소 로직 (반대편 대각선 모서리 완벽 고정)
    let isResizing = false;
    let resizeDir = '';
    let startW = 320, startH = 180, resizeStartX = 0, resizeStartY = 0;

    document.querySelectorAll('.resizer').forEach(resizer => {
      resizer.addEventListener('pointerdown', (e) => {
        isResizing = true;
        resizeDir = resizer.getAttribute('data-dir');
        modal.classList.add('interacting');
        try { resizer.setPointerCapture(e.pointerId); } catch (err) {}
        startW = modal.offsetWidth;
        startH = modalWindow.offsetHeight;
        initLeft = modal.offsetLeft;
        initTop = modal.offsetTop;
        resizeStartX = e.clientX;
        resizeStartY = e.clientY;
        e.stopPropagation();
        e.preventDefault();
      });
    });

    window.addEventListener('pointermove', (e) => {
      if (isDragging) {
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const now = Date.now();
        const dt = Math.max(1, now - lastMoveTime);
        velocityX = (e.clientX - lastMoveX) / dt;
        lastMoveX = e.clientX;
        lastMoveTime = now;

        // 좌/우는 제한 없이 화면 밖으로 날릴 수 있게 허용
        modal.style.left = `${initLeft + dx}px`;
        modal.style.top = `${Math.max(-30, Math.min(window.innerHeight - 55, initTop + dy))}px`;
        return;
      }

      if (isResizing) {
        const dx = e.clientX - resizeStartX;
        const dy = e.clientY - resizeStartY;
        const wFromX = resizeDir.includes('l') ? (startW - dx) : (startW + dx);
        const hFromY = resizeDir.includes('t') ? (startH - dy) : (startH + dy);
        const wFromY = hFromY * (16 / 9);
        const targetW = Math.abs(dx) >= Math.abs(dy) ? wFromX : wFromY;

        const dims = apply16by9Scale(targetW);

        // 좌측/상단 모서리 조작 시 반대편 우측/하단 모서리를 제자리에 고정
        if (resizeDir.includes('l')) {
          modal.style.left = `${initLeft + startW - dims.width}px`;
        }
        if (resizeDir.includes('t')) {
          modal.style.top = `${initTop + startH - dims.height}px`;
        }
      }
    });

    function finishPointerInteraction() {
      if (isDragging) {
        isDragging = false;
        modal.classList.remove('interacting');
        const rect = modal.getBoundingClientRect();

        // 창의 절반 가까이 좌/우 화면 바깥으로 나가거나 빠르게 좌/우로 날렸을 때 책갈피로 도킹
        if (rect.left + rect.width * 0.45 < 0 || (velocityX < -0.65 && rect.left < 28)) {
          dockPlayerToBookmark('left');
        } else if (rect.right - rect.width * 0.45 > window.innerWidth || (velocityX > 0.65 && rect.right > window.innerWidth - 28)) {
          dockPlayerToBookmark('right');
        } else {
          // 화면 안에 머물렀다면 상단 이탈만 부드럽게 보정
          if (rect.top < 0) modal.style.top = '4px';
        }
      }
      if (isResizing) {
        isResizing = false;
        modal.classList.remove('interacting');
      }
    }

    window.addEventListener('pointerup', finishPointerInteraction);
    window.addEventListener('pointercancel', finishPointerInteraction);
  </script>
</body>
</html>
