<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tube Audio Lab</title>

  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TubeAudio">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      padding-bottom: 160px;
    }
    h2 { text-align: center; margin-bottom: 10px; color: #ff0000; }
    
    #debug-box {
      background: #000;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 11px;
      color: #00ff00;
      margin-bottom: 15px;
      max-height: 90px;
      overflow-y: auto;
      word-break: break-all;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      position: sticky;
      top: 10px;
      z-index: 10;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }
    button.search-btn {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .video-list { display: flex; flex-direction: column; gap: 15px; }
    .video-item {
      display: flex;
      gap: 12px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
    }
    .video-item:active { background: #333; }
    .video-item img {
      width: 90px;
      height: 50px;
      object-fit: cover;
      border-radius: 4px;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }
    .video-channel { font-size: 12px; color: #aaa; }
    
    .player-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1e1e;
      border-top: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }
    .now-playing {
      font-size: 13px;
      color: #4CAF50;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    audio { width: 100%; height: 35px; }
  </style>
</head>
<body>

  <h2>Tube Audio Lab</h2>

  <!-- 실시간 진단 모니터 -->
  <div id="debug-box">[시스템] CORS 터널 준비 완료</div>

  <div class="search-box">
    <input type="text" id="query" placeholder="가수 또는 곡명 검색" onkeyup="if(window.event.keyCode==13){search()}">
    <button class="search-btn" onclick="search()">검색</button>
  </div>

  <div class="video-list" id="results"></div>

  <div class="player-container">
    <div id="nowPlaying" class="now-playing">대기 중...</div>
    <audio id="audioPlayer" controls playsinline></audio>
  </div>

  <script>
    // Invidious 노드 목록
    const NODES = [
      'https://inv.nadeko.net',
      'https://yewtu.be',
      'https://invidious.nerdvpn.de'
    ];
    let currentNode = NODES[0];

    const audioPlayer = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const resultsContainer = document.getElementById('results');
    const debugBox = document.getElementById('debug-box');

    function log(msg) {
      console.log(msg);
      debugBox.innerText = `> ${msg}\n` + debugBox.innerText.slice(0, 300);
    }

    // CORS 제한을 우회하여 JSON을 가져오는 스마트 터널 함수
    async function fetchWithCors(targetUrl) {
      // 1차 시도: 직접 통신
      try {
        const res = await fetch(targetUrl);
        if (res.ok) return await res.json();
      } catch (e) {
        log("직접 연결 실패, CORS 우회 터널 작동...");
      }

      // 2차 시도: AllOrigins 프록시 터널 경유
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
      const res2 = await fetch(proxyUrl);
      if (!res2.ok) throw new Error(`터널 에러 (HTTP ${res2.status})`);
      return await res2.json();
    }

    // 오디오 태그 에러 추적
    audioPlayer.onerror = () => {
      const err = audioPlayer.error;
      log(`[오디오 오류] 코드 ${err ? err.code : '알수없음'}`);
      nowPlaying.innerText = "재생 실패 (오디오 스트림 차단)";
    };

    // 1. 검색 (CORS 터널 통과)
    async function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;

      log(`검색 시작: "${q}"`);
      resultsContainer.innerHTML = '';

      for (let i = 0; i < NODES.length; i++) {
        currentNode = NODES[i];
        try {
          const target = `${currentNode}/api/v1/search?q=${encodeURIComponent(q)}&type=video`;
          log(`노드 요청: ${currentNode}`);
          const items = await fetchWithCors(target);
          
          log(`검색 완료 (${items.length}개 수신)`);
          renderResults(items);
          return;
        } catch (e) {
          log(`${currentNode} 실패: ${e.message}`);
        }
      }
      log("모든 검색 경로가 차단되었습니다.");
    }

    function renderResults(items) {
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-item';
        const thumb = item.videoThumbnails ? item.videoThumbnails[0].url : '';
        
        card.onclick = () => playStream(item.videoId, item.title, item.author, thumb);

        card.innerHTML = `
          <img src="${thumb}" loading="lazy" onerror="this.style.display='none'">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.author}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    // 2. 오디오 스트림 추출 및 재생
    async function playStream(videoId, title, artist, artworkUrl) {
      log(`곡 선택: ${videoId}`);
      nowPlaying.innerText = `[분석 중] ${title}`;

      // 아이폰 보안 락 즉시 해제 (무음 버퍼)
      audioPlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=";
      audioPlayer.play().catch(() => {});

      try {
        const target = `${currentNode}/api/v1/videos/${videoId}`;
        log("스트림 메타데이터 요청...");
        const data = await fetchWithCors(target);

        // 아이폰 사파리용 AAC/m4a 오디오 스트림 선별
        let audioStream = null;
        if (data.adaptiveFormats) {
          audioStream = data.adaptiveFormats.find(f => f.type && f.type.includes('audio/mp4'));
        }
        if (!audioStream && data.formatStreams) {
          audioStream = data.formatStreams[0];
        }

        if (!audioStream || !audioStream.url) {
          throw new Error("오디오 스트림 없음");
        }

        log("음원 주소 확보. 사파리 재생 시작...");
        audioPlayer.src = audioStream.url;
        await audioPlayer.play();

        nowPlaying.innerText = `[재생 중] ${title}`;
        log("재생 성공!");
        setupMediaSession(title, artist, artworkUrl);

      } catch (e) {
        log(`재생 실패 원인: ${e.message}`);
        nowPlaying.innerText = "재생 실패";
      }
    }

    function setupMediaSession(title, artist, artworkUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          artwork: [{ src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
      }
    }
  </script>
</body>
</html>
