<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tube Audio Lab</title>

  <!-- [Phase 1] 아이폰 전용 아이콘 및 PWA 설정 -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TubeAudio">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      padding: 15px;
      padding-bottom: 140px;
    }
    h2 { text-align: center; margin-bottom: 15px; color: #ff0000; }
    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      position: sticky;
      top: 10px;
      z-index: 10;
    }
    input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px 20px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .video-list { display: flex; flex-direction: column; gap: 15px; }
    .video-item {
      display: flex;
      gap: 12px;
      background: #1e1e1e;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      align-items: center;
    }
    .video-item:active { background: #333; }
    .video-item img {
      width: 100px;
      height: 56px;
      object-fit: cover;
      border-radius: 4px;
    }
    .video-info { flex: 1; overflow: hidden; }
    .video-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .video-channel { font-size: 12px; color: #aaa; }
    
    .player-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #1e1e1e;
      border-top: 1px solid #333;
      padding: 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
    }
    .now-playing {
      font-size: 13px;
      color: #4CAF50;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    audio { width: 100%; height: 35px; }
    .status-msg { text-align: center; color: #aaa; margin-top: 20px; font-size: 14px; }
    .err-text { color: #ff5252 !important; }
  </style>
</head>
<body>

  <h2>Tube Audio Lab</h2>

  <div class="search-box">
    <input type="text" id="query" placeholder="음악 또는 아티스트 검색" onkeyup="if(window.event.keyCode==13){search()}">
    <button onclick="search()">검색</button>
  </div>

  <div id="status" class="status-msg">검색어를 입력해보세요.</div>
  <div class="video-list" id="results"></div>

  <div class="player-container">
    <div id="nowPlaying" class="now-playing">대기 중...</div>
    <audio id="audioPlayer" controls playsinline preload="auto"></audio>
  </div>

  <script>
    // [Phase 2] 전 세계 분산 Invidious 프록시 네트워크
    const API_SERVERS = [
      'https://inv.nadeko.net',
      'https://invidious.nerdvpn.de',
      'https://yewtu.be'
    ];
    let activeServer = API_SERVERS[0];

    const audioPlayer = document.getElementById('audioPlayer');
    const nowPlaying = document.getElementById('nowPlaying');
    const resultsContainer = document.getElementById('results');
    const statusMsg = document.getElementById('status');

    // 1. 유튜브 검색 (살아있는 서버 자동 탐색)
    async function search() {
      const q = document.getElementById('query').value.trim();
      if (!q) return;

      statusMsg.className = "status-msg";
      statusMsg.innerText = "서버 연결 및 검색 중...";
      resultsContainer.innerHTML = '';

      let success = false;
      for (let i = 0; i < API_SERVERS.length; i++) {
        const server = API_SERVERS[i];
        try {
          const res = await fetch(`${server}/api/v1/search?q=${encodeURIComponent(q)}&type=video`);
          if (!res.ok) throw new Error();
          const items = await res.json();
          
          activeServer = server; // 응답에 성공한 서버를 메인으로 채택
          renderResults(items);
          statusMsg.innerText = '';
          success = true;
          break;
        } catch (e) {
          console.warn(`${server} 실패, 다음 예비 서버로 전환...`);
        }
      }

      if (!success) {
        statusMsg.className = "status-msg err-text";
        statusMsg.innerText = "모든 검색 서버가 응답하지 않습니다. 잠시 후 다시 시도해 주세요.";
      }
    }

    // 2. 검색 목록 렌더링
    function renderResults(items) {
      if (!items || items.length === 0) {
        statusMsg.innerText = "검색 결과가 없습니다.";
        return;
      }

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'video-item';
        const thumb = item.videoThumbnails ? item.videoThumbnails[0].url : '';
        
        // 클릭 즉시 실행
        card.onclick = () => playAudio(item.videoId, item.title, item.author, thumb);

        card.innerHTML = `
          <img src="${thumb}" loading="lazy" onerror="this.style.display='none'">
          <div class="video-info">
            <div class="video-title">${item.title}</div>
            <div class="video-channel">${item.author}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });
    }

    // 3. [Phase 2 핵심] 오디오 스트림 주입 및 사파리 백그라운드 재생
    function playAudio(videoId, title, artist, artworkUrl) {
      nowPlaying.innerText = `[연결 중] ${title}`;
      statusMsg.innerText = "";

      // 구글 차단 우회: local=true / 아이폰 호환 포맷: itag=140 (AAC)
      const streamUrl = `${activeServer}/latest_version?id=${videoId}&itag=140&local=true`;

      // 대기 시간 없이 즉시 주입 (사파리 재생 제한 우회)
      audioPlayer.src = streamUrl;
      audioPlayer.play()
        .then(() => {
          nowPlaying.innerText = `[재생 중] ${title}`;
          setupMediaSession(title, artist, artworkUrl);
        })
        .catch(err => {
          console.log("버퍼링 또는 자동재생 대기:", err);
        });

      // 스트림 로드 오류 시 처리
      audioPlayer.onerror = () => {
        nowPlaying.innerText = "재생 실패 (해당 서버 스트림 차단)";
        statusMsg.className = "status-msg err-text";
        statusMsg.innerText = "음원을 불러오지 못했습니다. 다른 곡을 선택하거나 잠시 후 시도하세요.";
      };
    }

    // 4. 모바일 백그라운드 & 잠금화면 제어 등록
    function setupMediaSession(title, artist, artworkUrl) {
      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: title,
          artist: artist,
          artwork: [{ src: artworkUrl, sizes: '512x512', type: 'image/jpeg' }]
        });

        navigator.mediaSession.setActionHandler('play', () => audioPlayer.play());
        navigator.mediaSession.setActionHandler('pause', () => audioPlayer.pause());
      }
    }
  </script>
</body>
</html>
