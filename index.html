<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Tube Audio Lab</title>

  <!-- [공개 모듈] Plyr 오픈소스 CSS (이중화) -->
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" 
        onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css';" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 10px;
      padding-bottom: 220px; /* 하단 고정 플레이어 공간 확보 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 1. 최상단 검색창 고정 영역 */
    .top-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0d0d0d;
      padding: 5px 0 10px 0;
    }
    .search-box {
      display: flex;
      gap: 6px;
    }
    input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1c1c1c;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    input:focus { border-color: #ff0000; }
    button.search-btn {
      padding: 10px 16px;
      border-radius: 8px;
      border: none;
      background: #ff0000;
      color: white;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    button.search-btn:active { background: #cc0000; }

    /* 상태 표시 바 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      padding: 4px 2px 8px 2px;
    }

    /* 2. [핵심] 가로 5칸 바둑판 그리드 피드 */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr); /* 정확히 가로 5등분 */
      gap: 5px; /* 모바일 폭에 맞춘 최적 간격 */
    }
    .video-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      background: #161616;
      border-radius: 4px;
      overflow: hidden;
      transition: transform 0.1s;
    }
    .video-card:active {
      transform: scale(0.96);
      background: #252525;
    }
    
    /* 16:9 비율 썸네일 박스 */
    .thumb-wrapper {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 고정 비율 */
      background: #222;
    }
    .thumb-wrapper img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 모바일 5칸 맞춤형 초소형 텍스트 */
    .card-info {
      padding: 4px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .video-title {
      font-size: 9.5px;
      font-weight: 500;
      line-height: 1.25;
      color: #ddd;
      display: -webkit-box;
      -webkit-line-clamp: 2; /* 2줄 초과 시 ... 말줄임 */
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }

    /* 3. 하단 고정 플레이어 */
    .bottom-player-container {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 200;
      background: #141414;
      border-top: 1px solid #282828;
      padding: 8px 12px 14px 12px;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.7);
    }
    .now-playing-title {
      font-size: 12px;
      font-weight: 600;
      color: #00ff88;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>

  <!-- 최상단 고정 검색 바 -->
  <div class="top-header">
    <div class="search-box">
      <input type="text" id="query" placeholder="가수 또는 곡명 검색" onkeyup="if(window.event.keyCode==13){startSearch()}">
      <button class="search-btn" onclick="startSearch()">검색</button>
    </div>
    <div class="status-bar">
      <span id="status">원하는 음악을 검색해보세요.</span>
      <span id="count"></span>
    </div>
  </div>

  <!-- [요구사항 반영] 바둑판 모양 가로 5칸 피드 -->
  <div class="video-grid" id="results"></div>

  <!-- 하단 고정형 클린 플레이어 (Plyr 모듈) -->
  <div class="bottom-player-container">
    <div id="nowPlaying" class="now-playing-title">재생할 곡을 터치하세요</div>
    <div id="player" data-plyr-provider="youtube" data-plyr-embed-id="M7lc1UVf-VE"></div>
  </div>

  <!-- [공개 모듈] Plyr 오픈소스 JS (이중화) -->
  <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js" 
          onerror="this.onerror=null;document.write('<script src=\'https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.js\'><\/script>')"></script>

  <script>
    const SEARCH_SERVERS = [
      'https://api.piped.private.coffee',
      'https://pipedapi.kavin.rocks',
      'https://api.piped.privacydev.net'
    ];
    let activeServerIndex = 0;

    const statusMsg = document.getElementById('status');
    const countMsg = document.getElementById('count');
    const nowPlaying = document.getElementById('nowPlaying');
    const resultsContainer = document.getElementById('results');

    const TARGET_COUNT = 100;
    let totalLoadedItems = 0;
    let isSearching = false;

    // 모바일 맞춤형 슬림 컨트롤러 초기화
    const player = new Plyr('#player', {
      controls: ['play', 'progress', 'current-time', 'mute', 'volume'],
      youtube: {
        noCookie: true,
        rel: 0,
        showinfo: 0,
        iv_load_policy: 3,
        modestbranding: 1
      }
    });

    // 다중 예비 서버 페일오버 통신
    async function smartFetch(path) {
      for (let i = 0; i < SEARCH_SERVERS.length; i++) {
        const serverIdx = (activeServerIndex + i) % SEARCH_SERVERS.length;
        const server = SEARCH_SERVERS[serverIdx];
        try {
          const res = await fetch(`${server}${path}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          activeServerIndex = serverIdx;
          return { data, server };
        } catch (e) {
          console.warn(`[서버 우회] ${server} 오류 ➔ 다음 서버 시도`);
        }
      }
      throw new Error("모든 검색 서버가 응답하지 않습니다.");
    }

    // 100개 검색 수집 루프
    async function startSearch() {
      const q = document.getElementById('query').value.trim();
      if (!q || isSearching) return;

      isSearching = true;
      totalLoadedItems = 0;
      resultsContainer.innerHTML = '';
      statusMsg.innerText = "수집 중...";
      countMsg.innerText = "(0/100)";

      try {
        let { data, server } = await smartFetch(`/search?q=${encodeURIComponent(q)}&filter=videos`);
        appendGrid(data.items);

        let nextPage = data.nextpage;
        while (nextPage && totalLoadedItems < TARGET_COUNT) {
          try {
            const nextPath = `/nextpage/search?nextpage=${encodeURIComponent(nextPage)}&q=${encodeURIComponent(q)}&filter=videos`;
            const nextRes = await fetch(`${server}${nextPath}`);
            const nextData = await nextRes.json();

            if (!nextData.items || nextData.items.length === 0) break;
            appendGrid(nextData.items);
            nextPage = nextData.nextpage;
          } catch (e) {
            break;
          }
        }

        statusMsg.innerText = "검색 완료";
        countMsg.innerText = `총 ${totalLoadedItems}개`;
      } catch (err) {
        statusMsg.innerText = err.message;
      } finally {
        isSearching = false;
      }
    }

    // 가로 5열 바둑판 피드 생성
    function appendGrid(items) {
      if (!items) return;

      items.forEach(item => {
        if (totalLoadedItems >= TARGET_COUNT) return;

        totalLoadedItems++;
        const videoId = item.url.replace('/watch?v=', '');
        
        const card = document.createElement('div');
        card.className = 'video-card';

        // 카드 클릭 시 하단 플레이어에서 즉시 재생
        card.onclick = () => {
          nowPlaying.innerText = `[재생 중] ${item.title}`;
          player.source = {
            type: 'video',
            sources: [{ src: videoId, provider: 'youtube' }],
          };
          player.play();
        };

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${item.thumbnail}" loading="lazy" onerror="this.src='https://via.placeholder.com/120x68/222/555?text=No'">
          </div>
          <div class="card-info">
            <div class="video-title">${item.title}</div>
          </div>
        `;
        resultsContainer.appendChild(card);
      });

      countMsg.innerText = `(${totalLoadedItems}/${TARGET_COUNT})`;
    }
  </script>
</body>
</html>
